<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>807｜班級資訊動態</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        html, body { width: 100%; min-height: 100%; }
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, 'Noto Sans TC'; background-color: #f2f2f7; -webkit-tap-highlight-color: transparent;}
        .loading-spinner { border: 3px solid #e5e5ea; border-top: 3px solid #d97706; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; } .custom-scrollbar::-webkit-scrollbar-thumb { background: #d1d1d6; border-radius: 10px; }
        
        .calendar-day { aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border-radius: 50%; transition: all 0.2s; font-weight: 500; font-size: 0.875rem; position: relative; color: #1c1c1e; }
        .calendar-day:hover { background-color: #e5e5ea; transform: scale(1.05); }
        .calendar-day.active { background-color: #d97706 !important; color: white !important; font-weight: 700; box-shadow: 0 4px 10px rgba(217,119,6,0.3); transform: scale(1.1); z-index: 10; }
        .calendar-day.is-today { color: #d97706; font-weight: 700; background-color: rgba(217,119,6,0.08); }
        .calendar-day.active.is-today { color: white; background-color: #d97706; }
        .calendar-day.is-leave { border: 2px solid #f59e0b; background-color: transparent; }
        .calendar-day.is-leave.active { background-color: #d97706 !important; border-color: #d97706 !important; color: white !important; }
        
        .calendar-day.has-note::after { content: ''; position: absolute; bottom: 4px; width: 5px; height: 5px; background-color: #007aff; border-radius: 50%; }
        .calendar-day.has-event::before { content: ''; position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; background-color: #a855f7; border-radius: 50%; }
        .calendar-day.is-late-un-signed::after { content: ''; position: absolute; bottom: 4px; width: 6px; height: 6px; background-color: #ff3b30; border-radius: 50%; box-shadow: 0 0 0 2px white; animation: pulse-red 2s infinite; }
        
        @keyframes pulse-red { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255,59,48,0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(255,59,48,0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255,59,48,0); } }
        
        .calendar-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: 700; color: #8e8e93; font-size: 0.75rem; margin-bottom: 0.75rem; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .note-content-area { line-height: 1.8; color: #1c1c1e; font-size: 1.15rem; white-space: pre-wrap; word-break: break-all; }
        
        /* 聊天室專用樣式 */
        .chat-bg { background-color: #8ba4b6; }
        .private-bg { background-color: #f2f2f7; }
        .chat-bubble-me { background-color: #85e047; }
        .chat-bubble-me-private { background-color: #007aff; color: white; }

        /* 家長端以手機閱讀為優先：內容在上、分頁導覽固定在底部。 */
        @media (max-width: 767px) {
            body { min-height: 100dvh; }
            #mainPage > nav {
                order: 2;
                padding: 0.5rem 0.75rem max(0.5rem, env(safe-area-inset-bottom));
                border-top: 1px solid #e5e5ea;
                border-bottom: 0;
                box-shadow: 0 -4px 16px rgba(28, 28, 30, 0.06);
            }
            #mainPage > nav > div { gap: 0.35rem; }
            #mainPage > nav > div > div:first-child {
                flex: 1 1 auto;
                max-width: none;
                min-width: 0;
            }
            #mainPage > nav button[id^="tab"] {
                flex: 1 1 0;
                min-height: 44px;
                padding: 0.45rem 0.25rem;
                font-size: 0.75rem;
                line-height: 1.1;
            }
            #mainPage > nav > div > div:last-child > button {
                width: 44px;
                height: 44px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            #mainPage > nav #tabContactBook.has-attention::after {
                content: '';
                position: absolute;
                top: 0.35rem;
                right: 0.35rem;
                width: 0.5rem;
                height: 0.5rem;
                border-radius: 9999px;
                background: #ff3b30;
                box-shadow: 0 0 0 2px #fff;
            }
            #mainPage > main { order: 1; }
            #bookPage > div:first-child {
                max-height: 45dvh;
                overflow-y: auto;
            }
            #bookPage > div:first-child > .p-3 { padding: 0.5rem 0.75rem; }
            #bookPage > div:first-child > div:first-child button { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
            #bookPage > div:first-child > div:first-child button:first-child { padding-left: .7rem; padding-right: .7rem; }
            #bookPage .calendar-day { aspect-ratio: auto; min-height: 1.85rem; height: 1.85rem; font-size: 0.75rem; }
            #bookPage .calendar-header { margin-bottom: 0.45rem; font-size: 0.6875rem; }
            #bookPage > div:first-child > .p-3 > .mt-3 { display: none; }
            #bookPage #contentContainer {
                padding: 1.25rem 1rem;
                font-size: 1rem;
            }
            #bookPage #footerAction { padding: 0.75rem 1rem max(0.75rem, env(safe-area-inset-bottom)); }
            #parentBookAction #footerAction { padding: 0.75rem 0; border-top: 0; box-shadow: none; }
            #groupChatScrollArea, #privateChatScrollArea { padding: 0.875rem; }
            #groupChatPage > div:first-child, #privateChatPage > div:first-child { padding: 0.875rem 1rem; }
            #privateChatPage > div:first-child button { min-height: 44px; }
            #groupChatInputArea, #privateChatInputArea { padding: 0.625rem 0.75rem max(0.625rem, env(safe-area-inset-bottom)); }
            .calendar-day { min-height: 2rem; font-size: 0.8125rem; }
            #loginPage input { min-height: 48px; }
            #loginPage button[type="button"] { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
            #loginPage #loginBtn { min-height: 52px; }
        }
    </style>
</head>
<body class="m-0 p-0 fixed inset-0 w-full h-full overflow-hidden flex flex-col text-[#1c1c1e] bg-[#f2f2f7]">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        function getSemesterData(targetDate) {
            const now = targetDate ? new Date(targetDate) : new Date();
            const sem115_02_Start = new Date('2027/02/01 00:00:00');
            const sem115_01_Start = new Date('2026/08/01 00:00:00');
            
            if (now >= sem115_02_Start) {
                return { config: { apiKey: "AIzaSyD_IvR1rEMxDSw3Fv_3zkM1mGetMQv8gg8", authDomain: "classcontact-c148d.firebaseapp.com", projectId: "classcontact-c148d", storageBucket: "classcontact-c148d.firebasestorage.app", messagingSenderId: "559132828543", appId: "1:559132828543:web:a47598010956175eda304a", measurementId: "G-4VGZCG5YV5" }, dbPath: 'contact-book-115-02', semesterName: '115學年度第2學期' };
            } else if (now >= sem115_01_Start) {
                return { config: { apiKey: "AIzaSyD_IvR1rEMxDSw3Fv_3zkM1mGetMQv8gg8", authDomain: "classcontact-c148d.firebaseapp.com", projectId: "classcontact-c148d", storageBucket: "classcontact-c148d.firebasestorage.app", messagingSenderId: "559132828543", appId: "1:559132828543:web:04512a17c5036edbda304a", measurementId: "G-1XM9JPNYLX" }, dbPath: 'contact-book-115-01', semesterName: '115學年度第1學期' };
            } else {
                return { config: { apiKey: "AIzaSyD_IvR1rEMxDSw3Fv_3zkM1mGetMQv8gg8", authDomain: "classcontact-c148d.firebaseapp.com", projectId: "classcontact-c148d", storageBucket: "classcontact-c148d.firebasestorage.app", messagingSenderId: "559132828543", appId: "1:559132828543:web:1b4aa5ef3a3f762ada304a", measurementId: "G-QLLC2GTYV8" }, dbPath: 'contact-book-114-02', semesterName: '114學年度第2學期' };
            }
        }

        const semesterData = getSemesterData();
        window.semesterData = semesterData; 
        
        const isCanvas = typeof __firebase_config !== 'undefined';
        const firebaseConfig = isCanvas ? JSON.parse(__firebase_config) : semesterData.config;
        const fbAppId = isCanvas && typeof __app_id !== 'undefined' ? __app_id : semesterData.dbPath;
        window.fbAppId = fbAppId; 

        window.CHAT_APP_ID = (isCanvas && typeof __app_id !== 'undefined') ? __app_id : 'contact-chat'; 
        
        window.unsubscribers = []; 
        window.globalUnsubscribers = []; 

        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzQBi-uoqSy73_VUD2xCpXqx2qPfARxvXxUFJwsd8wf_FcVkehubPpaDA0RQVgI11ky/exec";
        window.sessionToken = sessionStorage.getItem('contact-book-session');

        window.isAppsScriptHost = () => /(^|\.)script\.google\.com$|(^|\.)googleusercontent\.com$/.test(window.location.hostname);
        window.navigateToAppPage = (page) => {
            if (!window.isAppsScriptHost()) {
                window.location.assign(page === 'index' ? './index.html' : `./${page}.html`);
                return;
            }
            const url = `${GAS_API_URL}?page=${encodeURIComponent(page)}`;
            const link = document.createElement('a');
            link.href = url;
            link.target = '_top';
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            setTimeout(() => window.location.replace(url), 500);
        };

        window.goToUnifiedLogin = () => {
            sessionStorage.removeItem('contact-book-session');
            window.navigateToAppPage('index');
        };

        window.restoreUnifiedSession = async () => {
            if (!window.sessionToken) return window.goToUnifiedLogin();
            try {
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'validateSession', sessionToken: window.sessionToken })
                });
                const result = await response.json();
                if (!result.success || result.role !== 'parent' || !result.user) throw new Error('登入驗證失敗。');

                await initAuth();
                document.querySelectorAll('[onclick="location.reload()"]').forEach(button => {
                    button.onclick = window.goToUnifiedLogin;
                });
                window.currentUser = result.user;
                window.setupParentVoiceCallListener && window.setupParentVoiceCallListener();
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('mainPage').classList.remove('hidden');
                window.viewDate = new Date();
                window.selectedDateStr = window.todayStr;
                window.lastGroupChatCount = window.fbGroupChats.length;
                window.lastPrivateChatCount = window.fbPrivateChats.filter(c => c.studentId === window.currentUser.studentId).length;
                window.refreshUI();
            } catch (error) {
                window.goToUnifiedLogin();
            }
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let fbUser = null;
        window.currentUser = null;
        window.activeTab = 'calendar';
        
        window.lastGroupChatCount = 0;
        window.lastPrivateChatCount = 0;
        window.isChatInitialized = false;

        window.expandedGroupMonths = null; 
        window.expandedPrivateMonths = null;

        window.fbNotes = [];
        window.fbEvents = [];
        window.fbHolidays = [];
        window.fbRecords = [];
        window.fbGroupChats = []; 
        window.fbPrivateChats = []; 
        
        window.viewDate = new Date();
        window.selectedDateStr = "";
        window.todayStr = "";

        window.updateBookAttention = function() {
            const tabBook = document.getElementById('tabContactBook');
            if (!tabBook || !window.currentUser) return;

            const todayNote = window.fbNotes.find(note => note.date === window.todayStr && note.content && note.content.trim() !== '');
            const record = window.fbRecords.find(item => item.date === window.todayStr && item.studentId === window.currentUser.studentId);
            const isHoliday = window.fbHolidays.some(item => item.date === window.todayStr && item.isHoliday);
            const needsSignature = Boolean(todayNote) && !isHoliday && !(record && (record.signed || record.isLeave));
            tabBook.classList.toggle('has-attention', needsSignature);
        };

        window.updateChatUnreadIndicators = function() {
            if (!window.currentUser) return;
            const chatTypes = [
                { tab: 'group', badge: 'groupUnreadBadge', messages: window.fbGroupChats.filter(message => message.studentId !== window.currentUser.studentId) },
                { tab: 'private', badge: 'privateUnreadBadge', messages: window.fbPrivateChats.filter(message => message.studentId === window.currentUser.studentId && message.sender === 'teacher') }
            ];

            chatTypes.forEach(({ tab, badge, messages }) => {
                const badgeElement = document.getElementById(badge);
                const latestMessage = messages[messages.length - 1];
                if (!badgeElement || !latestMessage || !latestMessage.timestamp) return;

                const storageKey = `contact-book-read-${tab}-${window.currentUser.studentId}`;
                const lastReadAt = localStorage.getItem(storageKey);
                if (window.activeTab === tab || !lastReadAt) {
                    localStorage.setItem(storageKey, latestMessage.timestamp);
                    badgeElement.classList.add('hidden');
                    return;
                }
                badgeElement.classList.toggle('hidden', latestMessage.timestamp <= lastReadAt);
            });
        };

        window.checkSemesterSwitch = function(dateObj) {
            const newSemData = getSemesterData(dateObj);
            const newAppId = isCanvas && typeof __app_id !== 'undefined' ? __app_id : newSemData.dbPath;

            if (window.semesterData.dbPath !== newSemData.dbPath) {
                window.fbAppId = newAppId;
                window.semesterData = newSemData;
                window.fbNotes = [];
                window.fbEvents = [];
                window.fbHolidays = [];
                window.fbRecords = [];
                window.expandedGroupMonths = null;
                window.expandedPrivateMonths = null;
                window.refreshUI();
                
                const dbBadge = document.getElementById('dbStatusBadge');
                if(dbBadge) dbBadge.innerText = `目前學年度：${newSemData.semesterName}`;
                
                if (fbUser) setupSemesterListeners();
            }
        };

        window.normalizeDate = function(str) {
            if (!str) return "";
            const d = new Date(str);
            if (isNaN(d.getTime())) {
                const parts = str.split(/[\/\-]/);
                if (parts.length < 3) return str;
                return `${parts[0]}/${String(parts[1]).padStart(2, '0')}/${String(parts[2]).padStart(2, '0')}`;
            }
            return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
        };
        window.toDocId = function(dateStr) { return dateStr.replaceAll('/', '-'); };
        window.getPreciseTime = function() {
            const now = new Date();
            return `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}點${String(now.getMinutes()).padStart(2,'0')}分`;
        };

        window.todayStr = window.normalizeDate(new Date());

        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) { console.error(e); }
        };

        onAuthStateChanged(auth, user => {
            fbUser = user;
            if (user) {
                setupGlobalListeners();
                setupSemesterListeners();
            }
        });

        function setupSemesterListeners() {
            window.unsubscribers.forEach(unsub => unsub());
            window.unsubscribers = [];

            const pathNotes = collection(db, 'artifacts', window.fbAppId, 'public', 'data', 'notes');
            window.unsubscribers.push(onSnapshot(pathNotes, snap => {
                window.fbNotes = snap.docs.map(d => ({ date: d.id.replaceAll('-','/'), content: d.data().content }));
                window.refreshUI();
            }, e => console.error(e)));

            const pathEvents = collection(db, 'artifacts', window.fbAppId, 'public', 'data', 'calendar_events');
            window.unsubscribers.push(onSnapshot(pathEvents, snap => {
                window.fbEvents = snap.docs.map(d => ({ date: d.id.replaceAll('-','/'), event: d.data().event }));
                window.refreshUI();
            }, e => console.error(e)));

            const pathHolidays = collection(db, 'artifacts', window.fbAppId, 'public', 'data', 'holidays');
            window.unsubscribers.push(onSnapshot(pathHolidays, snap => {
                window.fbHolidays = snap.docs.map(d => ({ date: d.id.replaceAll('-','/'), isHoliday: d.data().isHoliday }));
                window.refreshUI();
            }, e => console.error(e)));

            const pathRecords = collection(db, 'artifacts', window.fbAppId, 'public', 'data', 'daily_records');
            window.unsubscribers.push(onSnapshot(pathRecords, snap => {
                window.fbRecords = snap.docs.map(d => ({ date: d.data().date, studentId: d.data().studentId, signed: d.data().signed, isLeave: d.data().isLeave }));
                window.refreshUI();
            }, e => console.error(e)));
        }

        function setupGlobalListeners() {
            window.globalUnsubscribers.forEach(unsub => unsub());
            window.globalUnsubscribers = [];

            const pathGroupChat = collection(db, 'artifacts', window.CHAT_APP_ID, 'public', 'data', 'group_chat');
            window.globalUnsubscribers.push(onSnapshot(pathGroupChat, snap => {
                window.fbGroupChats = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                window.fbGroupChats.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
                
                if (window.isChatInitialized && window.activeTab !== 'group' && window.fbGroupChats.length > window.lastGroupChatCount) {
                    const badge = document.getElementById('groupUnreadBadge');
                    if(badge) badge.classList.remove('hidden');
                }
                
                window.lastGroupChatCount = window.fbGroupChats.length;
                if (!window.isChatInitialized && window.currentUser) {
                    window.isChatInitialized = true;
                }
                window.refreshUI();
            }, e => console.error(e)));

            const pathPrivateChat = collection(db, 'artifacts', window.CHAT_APP_ID, 'public', 'data', 'private_chats');
            window.globalUnsubscribers.push(onSnapshot(pathPrivateChat, snap => {
                window.fbPrivateChats = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                window.fbPrivateChats.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
                
                if (window.currentUser) {
                    const myChats = window.fbPrivateChats.filter(c => c.studentId === window.currentUser.studentId);
                    if (window.isChatInitialized && window.activeTab !== 'private' && myChats.length > window.lastPrivateChatCount) {
                        const badge = document.getElementById('privateUnreadBadge');
                        if(badge) badge.classList.remove('hidden');
                    }
                    window.lastPrivateChatCount = myChats.length;
                }
                window.refreshUI();
            }, e => console.error(e)));
        }

        // 一對一語音通話：協商資料經由已登入的 Apps Script 工作階段傳遞，音訊不會寫入資料庫。
        window.parentVoiceCall = { peer: null, localStream: null, callId: null, incoming: null, pollTimer: null, teacherCandidateIndex: 0, iceServers: null, remoteDescriptionSet: false, pendingTeacherCandidates: [], candidateQueue: Promise.resolve(), connectionTimer: null };

        window.parentVoiceCallApi = async (action, payload = {}) => {
            const response = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action, sessionToken: window.sessionToken, ...payload }) });
            const result = await response.json();
            if (!result.success) throw new Error(result.message || '通話服務暫時無法使用。');
            return result;
        };

        // Serialize ICE signaling because the Apps Script cache is protected by a short lock.
        window.queueParentVoiceCandidate = (call, candidate) => {
            const send = async () => {
                for (let attempt = 0; attempt < 3; attempt += 1) {
                    try {
                        await window.parentVoiceCallApi('voiceCallCandidate', { callId: call.callId, candidate });
                        return;
                    } catch (error) {
                        if (attempt === 2) return console.error(error);
                        await new Promise(resolve => setTimeout(resolve, 350 * (attempt + 1)));
                    }
                }
            };
            call.candidateQueue = (call.candidateQueue || Promise.resolve()).then(send, send);
            return call.candidateQueue;
        };

        window.updateParentVoiceCallUi = (title, status, mode = 'incoming') => {
            const modal = document.getElementById('parentVoiceCallModal');
            const titleElement = document.getElementById('parentVoiceCallTitle');
            const statusElement = document.getElementById('parentVoiceCallStatus');
            const actions = document.getElementById('parentVoiceCallActions');
            const hangup = document.getElementById('parentVoiceCallHangup');
            if (modal) { modal.classList.remove('hidden'); modal.classList.add('flex'); }
            if (titleElement) titleElement.textContent = title;
            if (statusElement) statusElement.textContent = status;
            if (actions) actions.classList.toggle('hidden', mode !== 'incoming');
            if (hangup) hangup.classList.toggle('hidden', mode !== 'connected');
        };

        window.stopParentVoiceCall = () => {
            const call = window.parentVoiceCall;
            if (call.connectionTimer) clearTimeout(call.connectionTimer);
            if (call.peer) call.peer.close();
            if (call.localStream) call.localStream.getTracks().forEach(track => track.stop());
            const audio = document.getElementById('parentRemoteAudio');
            if (audio) audio.srcObject = null;
            window.parentVoiceCall = { peer: null, localStream: null, callId: null, incoming: null, pollTimer: call.pollTimer, teacherCandidateIndex: 0, iceServers: null, remoteDescriptionSet: false, pendingTeacherCandidates: [], candidateQueue: Promise.resolve(), connectionTimer: null };
            const modal = document.getElementById('parentVoiceCallModal');
            if (modal) { modal.classList.add('hidden'); modal.classList.remove('flex'); }
            window.updateParentVoiceCallPolling && window.updateParentVoiceCallPolling();
        };

        window.endParentVoiceCall = async (status = 'ended') => {
            const call = window.parentVoiceCall;
            try {
                if (call.callId) await window.parentVoiceCallApi('voiceCallUpdate', { callId: call.callId, status });
            } catch (error) { console.error(error); }
            window.stopParentVoiceCall();
        };

        window.declineVoiceCall = async () => {
            const call = window.parentVoiceCall;
            if (!call.callId) return window.stopParentVoiceCall();
            try { await window.parentVoiceCallApi('voiceCallUpdate', { callId: call.callId, status: 'declined' }); } catch (error) { console.error(error); }
            window.stopParentVoiceCall();
        };

        window.acceptVoiceCall = async () => {
            const call = window.parentVoiceCall;
            const incoming = call.incoming;
            if (!incoming || !call.callId || incoming.callId !== call.callId) return;
            window.updateParentVoiceCallUi('正在接聽', '正在請求麥克風權限…', 'connecting');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false });
                const config = await window.parentVoiceCallApi('voiceCallConfig');
                call.iceServers = config.iceServers;
                const peer = new RTCPeerConnection({ iceServers: call.iceServers });
                window.parentVoiceCall.peer = peer;
                window.parentVoiceCall.localStream = stream;
                call.remoteDescriptionSet = false;
                call.pendingTeacherCandidates = [];
                stream.getTracks().forEach(track => peer.addTrack(track, stream));
                peer.ontrack = event => { const audio = document.getElementById('parentRemoteAudio'); if (audio) { audio.srcObject = event.streams[0]; audio.play().catch(() => {}); } };
                peer.onconnectionstatechange = () => {
                    if (peer.connectionState === 'connected') {
                        if (call.connectionTimer) clearTimeout(call.connectionTimer);
                        window.updateParentVoiceCallUi('與老師通話中', '語音通話已接通。', 'connected');
                    }
                    if (['failed', 'disconnected'].includes(peer.connectionState)) window.updateParentVoiceCallUi('通話連線中斷', '網路連線不穩，請結束後再試一次。', 'connected');
                };
                peer.onicecandidate = event => {
                    if (event.candidate) window.queueParentVoiceCandidate(call, event.candidate.toJSON());
                };
                await peer.setRemoteDescription(incoming.offer);
                call.remoteDescriptionSet = true;
                const initialTeacherCandidates = call.pendingTeacherCandidates.splice(0);
                for (const candidate of initialTeacherCandidates) {
                    await peer.addIceCandidate(new RTCIceCandidate(candidate));
                }
                const answer = await peer.createAnswer();
                await peer.setLocalDescription(answer);
                await window.parentVoiceCallApi('voiceCallUpdate', { callId: call.callId, status: 'accepted', answer: { type: answer.type, sdp: answer.sdp } });
                call.connectionTimer = setTimeout(() => {
                    if (window.parentVoiceCall !== call || peer.connectionState === 'connected') return;
                    window.updateParentVoiceCallUi('連線逾時', '雙方已接聽，但音訊連線未建立。請確認 TURN 設定與網路後重試。', 'connected');
                }, 35000);
                window.updateParentVoiceCallUi('正在與老師連線', '請稍候，正在建立語音連線…', 'connecting');
            } catch (error) {
                console.error(error);
                window.updateParentVoiceCallUi('無法接聽通話', error.name === 'NotAllowedError' ? '請允許使用麥克風後再試一次。' : '無法建立連線，請檢查網路後再試一次。', 'incoming');
            }
        };

        window.pollParentVoiceCall = async () => {
            if (!window.currentUser) return;
            try {
                const result = await window.parentVoiceCallApi('voiceCallPoll');
                const remote = result.call;
                const call = window.parentVoiceCall;
                if (!remote) return;
                if (remote.status === 'ringing' && remote.initiatedBy === 'teacher' && remote.expiresAt > Date.now() && remote.callId !== call.callId) {
                    call.callId = remote.callId;
                    call.incoming = remote;
                    call.teacherCandidateIndex = 0;
                    call.remoteDescriptionSet = false;
                    call.pendingTeacherCandidates = [];
                    window.updateParentVoiceCallUi('老師來電', '老師邀請您進行一對一語音通話。', 'incoming');
                }
                if (remote.callId !== call.callId) return;
                if (call.peer) {
                    const candidates = remote.teacherCandidates || [];
                    while (call.teacherCandidateIndex < candidates.length) {
                        const candidate = candidates[call.teacherCandidateIndex++];
                        if (!call.remoteDescriptionSet) {
                            call.pendingTeacherCandidates.push(candidate);
                            continue;
                        }
                        await call.peer.addIceCandidate(new RTCIceCandidate(candidate));
                    }
                }
                if (['ended', 'missed', 'declined'].includes(remote.status)) window.stopParentVoiceCall();
            } catch (error) { console.error(error); }
        };

                call.pollTimer = setInterval(window.pollParentVoiceCall, 2500);

            } else if (!shouldPoll && call.pollTimer) {

        // ==========================

        function renderGroupChat() {
            const container = document.getElementById('groupChatMessageList');
            if(!container) return;

            if(window.fbGroupChats.length === 0) {
                container.innerHTML = '<div class="text-center text-slate-100/70 mt-10 text-sm font-bold bg-black/10 mx-auto px-4 py-2 rounded-full w-max">目前還沒有人發言，來打個招呼吧！</div>';
                return;
            }

            const msgsByMonth = {};
            window.fbGroupChats.forEach(msg => {
                const monthKey = msg.timestamp.substring(0, 7); 
                if (!msgsByMonth[monthKey]) msgsByMonth[monthKey] = [];
                msgsByMonth[monthKey].push(msg);
            });
            const sortedMonths = Object.keys(msgsByMonth).sort();

            if (window.expandedGroupMonths === null) {
                window.expandedGroupMonths = {};
                if (sortedMonths.length > 0) {
                    window.expandedGroupMonths[sortedMonths[sortedMonths.length - 1]] = true;
                }
            } else {
                sortedMonths.forEach(m => {
                    if (window.expandedGroupMonths[m] === undefined) {
                        window.expandedGroupMonths[m] = true;
                    }
                });
            }

            let html = '';

            sortedMonths.forEach(monthKey => {
                const isExpanded = window.expandedGroupMonths[monthKey];
                const monthMsgs = msgsByMonth[monthKey];
                const monthTitle = `${monthKey.split('/')[0]}年${parseInt(monthKey.split('/')[1])}月`;

                html += `
                    <div class="flex justify-center my-4 sticky top-2 z-10">
                        <button onclick="window.toggleGroupMonth('${monthKey}')" class="flex items-center gap-1.5 bg-black/30 backdrop-blur shadow-sm border border-white/10 text-white text-[13px] font-bold px-4 py-1.5 rounded-full hover:bg-black/40 transition-colors">

                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </button>
                    </div>
                `;

                if (isExpanded) {
                    let lastDate = '';
                    monthMsgs.forEach(msg => {
                        const msgDate = msg.timestamp.split(' ')[0];
                        const msgTime = msg.timestamp.split(' ')[1];
                        
                        const isMe = msg.studentId === window.currentUser.studentId;
                        const isTeacher = msg.studentId === 'teacher' || msg.sender === 'teacher';
                        
                        // 🌟 判斷是否為圖片訊息
                        const isImage = msg.messageType === 'image';
                        
                        if(msgDate !== lastDate) {
                            html += `<div class="text-center my-4"><span class="bg-black/15 text-white text-xs font-medium px-3 py-1 rounded-full shadow-sm">${msgDate}</span></div>`;
                            lastDate = msgDate;
                        }

                        // 生成訊息內嵌泡泡內容
                        const bubbleContent = isImage

                                    </div>

                                        <div class="flex items-end gap-1.5">
                                            <div class="${isImage ? 'bg-transparent p-0 border-none shadow-none' : 'bg-white border-2 border-[#d97706]/30 text-[#1c1c1e] px-3.5 py-2.5 rounded-2xl rounded-tl-sm shadow-md'} max-w-full break-words text-[15px] leading-relaxed relative">

                                            <span class="text-[10px] text-slate-100/70 mb-1 font-medium">${msgTime}</span>

                                                ${bubbleContent}

            container.innerHTML = html;

        // ==========================
        // 🌟 私訊老師渲染 (支援圖片與月份折疊)
        // ==========================
        function renderPrivateChat() {
            const container = document.getElementById('privateChatMessageList');
            if(!container) return;

            const myChats = window.fbPrivateChats.filter(c => c.studentId === window.currentUser.studentId);
            const pendingRequest = myChats.find(message => message.messageType === 'call_request' && Number(message.callRequestExpiresAt || 0) > Date.now());
            const requestButton = document.getElementById('parentVoiceRequestButton');
            if (requestButton) {
                requestButton.disabled = Boolean(pendingRequest);
                requestButton.textContent = pendingRequest ? '等待老師' : '申請通話';
                requestButton.classList.toggle('opacity-50', Boolean(pendingRequest));
            }

            if(myChats.length === 0) {
                container.innerHTML = '<div class="text-center text-slate-400 mt-10 text-sm font-bold bg-white mx-auto px-4 py-2 rounded-full w-max shadow-sm border border-slate-200">這是您與老師的專屬空間，有問題隨時發問！</div>';
                return;
            }

            const msgsByMonth = {};
            myChats.forEach(msg => {
                const monthKey = msg.timestamp.substring(0, 7); 
                if (!msgsByMonth[monthKey]) msgsByMonth[monthKey] = [];
                msgsByMonth[monthKey].push(msg);
            });
            const sortedMonths = Object.keys(msgsByMonth).sort();

            if (window.expandedPrivateMonths === null) {
                window.expandedPrivateMonths = {};
                if (sortedMonths.length > 0) {
                    window.expandedPrivateMonths[sortedMonths[sortedMonths.length - 1]] = true;
                }
            } else {
                sortedMonths.forEach(m => {
                    if (window.expandedPrivateMonths[m] === undefined) {
                        window.expandedPrivateMonths[m] = true;
                    }
                });
            }

            let html = '';

            sortedMonths.forEach(monthKey => {
                const isExpanded = window.expandedPrivateMonths[monthKey];
                const monthMsgs = msgsByMonth[monthKey];
                const monthTitle = `${monthKey.split('/')[0]}年${parseInt(monthKey.split('/')[1])}月`;

                html += `
                    <div class="flex justify-center my-4 sticky top-2 z-10">
                        <button onclick="window.togglePrivateMonth('${monthKey}')" class="flex items-center gap-1.5 bg-white/90 backdrop-blur shadow-sm border border-slate-200 text-slate-600 text-[13px] font-bold px-4 py-1.5 rounded-full hover:bg-slate-50 transition-colors">
                            ${monthTitle} (${monthMsgs.length}則)
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </button>
                    </div>
                `;

                if (isExpanded) {
                    let lastDate = '';
                    monthMsgs.forEach(msg => {
                        const msgDate = msg.timestamp.split(' ')[0];
                        const msgTime = msg.timestamp.split(' ')[1];
                        const isMe = msg.sender === 'parent';
                        const isImage = msg.messageType === 'image';
                        const isCallRequest = msg.messageType === 'call_request';
                        
                        if(msgDate !== lastDate) {
                            html += `<div class="text-center my-4"><span class="bg-slate-200 text-slate-500 text-xs font-medium px-3 py-1 rounded-full shadow-sm">${msgDate}</span></div>`;
                            lastDate = msgDate;
                        }

                        const bubbleContent = isImage 
                            ? `<img src="${msg.text}" onclick="window.previewImage('${msg.text}')" class="max-w-[200px] sm:max-w-[280px] rounded-xl cursor-zoom-in hover:brightness-95 transition-all shadow-sm border border-slate-200" alt="圖片載入中..." onerror="this.onerror=null; this.src='https://placehold.co/300?text=圖片載入失敗';"/>`
                            : (isCallRequest
                                ? `<div class="font-black">&#128222; 申請語音通話</div><div class="mt-1 text-xs opacity-80">${Number(msg.callRequestExpiresAt || 0) > Date.now() ? '5 分鐘內有效' : '申請已逾時'}</div>`
                                : msg.text);

                        if(isMe) {
                            html += `
                                <div class="flex justify-end mb-4 pl-12 fade-in">
                                    <div class="flex items-end gap-1.5">
                                        <span class="text-[10px] text-slate-400 mb-1 font-medium">${msgTime}</span>
                                        <div class="${isImage ? 'bg-transparent p-0' : 'chat-bubble-me-private px-3.5 py-2.5 rounded-2xl rounded-tr-sm shadow-sm'} max-w-full break-words text-[15px] leading-relaxed relative">
                                            ${bubbleContent}
                                        </div>
                                    </div>
                                </div>
                            `;
                        } else {
                            html += `
                                <div class="flex justify-start mb-4 pr-12 fade-in">
                                    <div class="w-9 h-9 rounded-full bg-[#d97706] flex items-center justify-center text-white text-[15px] font-bold shrink-0 mr-2 shadow-sm mt-1 border border-[#b45309]">
                                        T
                                    </div>
                                    <div>
                                        <div class="text-xs text-slate-500 ml-1 mb-1 font-bold">蘇老師</div>
                                        <div class="flex items-end gap-1.5">
                                            <div class="${isImage ? 'bg-transparent p-0 border-none shadow-none' : 'bg-white border border-slate-200 text-[#1c1c1e] px-3.5 py-2.5 rounded-2xl rounded-tl-sm shadow-sm'} max-w-full break-words text-[15px] leading-relaxed relative">
                                                ${bubbleContent}
                                            </div>
                                            <span class="text-[10px] text-slate-400 mb-1 font-medium">${msgTime}</span>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }
                    });
                }
            });

            container.innerHTML = html;
        }

        window.scrollToGroupChatBottom = () => {
            const container = document.getElementById('groupChatScrollArea');
            if(container) container.scrollTop = container.scrollHeight;
        };

        window.scrollToPrivateChatBottom = () => {
            const container = document.getElementById('privateChatScrollArea');
            if(container) container.scrollTop = container.scrollHeight;
        };

        // 🌟 圖片彈出放大預覽
        window.previewImage = (url) => {
            Swal.fire({
                imageUrl: url,
                imageAlt: '圖片載入中',
                showConfirmButton: false,
                background: 'transparent',
                backdrop: 'rgba(0,0,0,0.85)',
                customClass: {
                    image: 'max-h-[85vh] object-contain rounded-xl'
                }
            });
        };

        // 🌟 處理選擇相片並非同步上傳至 Google 雲端硬碟
        window.setChatComposerLoading = (input, isLoading) => {
            const button = input && input.parentElement ? input.parentElement.querySelector('button') : null;
            if (!button) return;
            input.disabled = isLoading;
            button.disabled = isLoading;
            button.setAttribute('aria-busy', String(isLoading));
            button.classList.toggle('opacity-60', isLoading);
            if (isLoading) {
                button.dataset.originalHtml = button.innerHTML;
                button.innerHTML = '<span class="loading-spinner border-white/30 border-t-white !w-5 !h-5"></span>';
            } else if (button.dataset.originalHtml) {
                button.innerHTML = button.dataset.originalHtml;
                delete button.dataset.originalHtml;
            }
        };

        window.offerChatRetry = (title, retry) => {
            Swal.fire({
                icon: 'error',
                title: title,
                text: '請檢查網路後重試；原本的內容已保留。',
                showCancelButton: true,
                confirmButtonText: '重試',
                cancelButtonText: '稍後'
            }).then(result => { if (result.isConfirmed) retry(); });
        };

        window.offerImageRetry = (file, type) => {
            Swal.fire({
                icon: 'error',
                title: '圖片上傳失敗',
                text: '請檢查網路後重試；已選取的圖片會保留。',
                showCancelButton: true,
                confirmButtonText: '重試',
                cancelButtonText: '稍後'
            }).then(result => {
                if (result.isConfirmed) window.handleImageUpload({ files: [file], value: '' }, type, file);
            });
        };

        window.handleImageUpload = async (inputElement, type, retryFile = null) => {
            if(!checkFbAuth() || !window.currentUser) return;
            const file = retryFile || inputElement.files[0];
            if (!file) return;

            // 限制檔案大小 (不超過 5MB)
            if (file.size > 5 * 1024 * 1024) {
                Swal.fire('無法傳送', '照片檔案過大，請勿超過 5MB。', 'error');
                return;
            }

            Swal.fire({
                title: '上傳圖片中...',
                text: '正在將圖片儲存至 Google 雲端硬碟',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const base64Data = reader.result.split(',')[1];
                try {
                    // 對接 Google Apps Script API 將圖片上傳雲端硬碟
                    const resp = await fetch(GAS_API_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'uploadImage',
                            sessionToken: window.sessionToken,
                            base64Data: base64Data,
                            fileName: `${window.currentUser.studentId}_${Date.now()}.${file.name.split('.').pop()}`,
                            mimeType: file.type,
                            chatType: type, // 告知後端是 group 還是 private
                            studentId: window.currentUser.studentId // 提供學號建立專屬資料夾
                        })
                    });
                    const res = await resp.json();

                    if (res.success && res.imageUrl) {
                        Swal.close();
                        // 成功拿到 Google 雲端硬碟連結後，寫入 Firebase 聊天訊息中
                        if (type === 'group') {
                            await addDoc(collection(db, 'artifacts', window.CHAT_APP_ID, 'public', 'data', 'group_chat'), {
                                studentId: window.currentUser.studentId,
                                name: window.currentUser.name,
                                seatNo: window.currentUser.seatNo,
                                sender: 'parent',
                                text: res.imageUrl, // 存放雲端公開外鏈 URL
                                messageType: 'image', // 標註訊息型態
                                timestamp: window.getPreciseTime()
                            });
                            setTimeout(window.scrollToGroupChatBottom, 100);
                        } else {
                            await addDoc(collection(db, 'artifacts', window.CHAT_APP_ID, 'public', 'data', 'private_chats'), {
                                studentId: window.currentUser.studentId,
                                name: window.currentUser.name,
                                seatNo: window.currentUser.seatNo,
                                sender: 'parent',
                                text: res.imageUrl,
                                messageType: 'image',
                                timestamp: window.getPreciseTime()
                            });
                            setTimeout(window.scrollToPrivateChatBottom, 100);
                        }
                    } else {
                        throw new Error(res.message || '上傳失敗');
                    }
                } catch (e) {
                    console.error(e);
                    window.offerImageRetry(file, type);
                } finally {
                    inputElement.value = ''; // 清空欄位以便重複選擇同張照片
                }
            };
        };

        window.sendGroupChatMessage = async (retryText = null) => {
            if(!checkFbAuth() || !window.currentUser) return;
            const input = document.getElementById('groupChatInput');
            const text = (retryText || input.value).trim();
            if(!text) return;
            
            window.setChatComposerLoading(input, true);
            try {
                await addDoc(collection(db, 'artifacts', window.CHAT_APP_ID, 'public', 'data', 'group_chat'), {
                    studentId: window.currentUser.studentId,
                    name: window.currentUser.name,
                    seatNo: window.currentUser.seatNo,
                    sender: 'parent',
                    text: text,
                    messageType: 'text',
                    timestamp: window.getPreciseTime()
                });
                input.value = '';
                input.style.height = 'auto'; 
            } catch(e) {
                console.error(e);
                window.offerChatRetry('發送失敗', () => window.sendGroupChatMessage(text));
            } finally {
                window.setChatComposerLoading(input, false);
                setTimeout(() => {
                    input.focus();
                    window.scrollToGroupChatBottom();
                }, 50);
            }
        };

        window.sendPrivateChatMessage = async (retryText = null) => {
            if(!checkFbAuth() || !window.currentUser) return;
            const input = document.getElementById('privateChatInput');
            const text = (retryText || input.value).trim();
            if(!text) return;
            
            window.setChatComposerLoading(input, true);
            try {
                await addDoc(collection(db, 'artifacts', window.CHAT_APP_ID, 'public', 'data', 'private_chats'), {
                    studentId: window.currentUser.studentId,
                    name: window.currentUser.name,
                    seatNo: window.currentUser.seatNo,
                    sender: 'parent',
                    text: text,
                    messageType: 'text',
                    timestamp: window.getPreciseTime()
                });
                input.value = '';
                input.style.height = 'auto'; 
            } catch(e) {
                console.error(e);
                window.offerChatRetry('發送失敗', () => window.sendPrivateChatMessage(text));
            } finally {
                window.setChatComposerLoading(input, false);
                setTimeout(() => {
                    input.focus();
                    window.scrollToPrivateChatBottom();
                }, 50);
            }
        };

        window.requestVoiceCall = async () => {
            if (!checkFbAuth() || !window.currentUser) return;
            const existingRequest = window.fbPrivateChats.find(message => message.studentId === window.currentUser.studentId && message.messageType === 'call_request' && Number(message.callRequestExpiresAt || 0) > Date.now());
            if (existingRequest) {
                const minutesLeft = Math.max(1, Math.ceil((Number(existingRequest.callRequestExpiresAt) - Date.now()) / 60000));
                Swal.fire('申請已送出', `請等待老師回覆，申請約 ${minutesLeft} 分鐘後失效。`, 'info');
                return;
            }
            const confirmation = await Swal.fire({
                icon: 'question',
                title: '申請語音通話',
                text: '系統會通知老師；老師可在 5 分鐘內決定是否發起通話。',
                showCancelButton: true,
                confirmButtonText: '送出申請',
                cancelButtonText: '返回',
                confirmButtonColor: '#059669'
            });
            if (!confirmation.isConfirmed) return;
            try {
                await addDoc(collection(db, 'artifacts', window.CHAT_APP_ID, 'public', 'data', 'private_chats'), {
                    studentId: window.currentUser.studentId,
                    name: window.currentUser.name,
                    seatNo: window.currentUser.seatNo,
                    sender: 'parent',
                    text: '📞 申請語音通話',
                    messageType: 'call_request',
                    callRequestExpiresAt: Date.now() + (5 * 60 * 1000),
                    timestamp: window.getPreciseTime()
                });
                window.updateParentVoiceCallPolling && window.updateParentVoiceCallPolling();
                setTimeout(() => window.refreshUI(), (5 * 60 * 1000) + 1000);
                Swal.fire({ icon: 'success', title: '已通知老師', text: '請保持在私訊頁面，等待老師發起通話。', showConfirmButton: false, timer: 1800 });
            } catch (error) {
                Swal.fire('系統錯誤', error.message || '無法送出申請，請再試一次。', 'error');
            }
        };

        window.changeMonth = (offset) => {
            const [year, month, day] = window.selectedDateStr.split('/').map(Number);
            const targetMonth = new Date(year, month - 1 + offset, 1);
            const lastDay = new Date(targetMonth.getFullYear(), targetMonth.getMonth() + 1, 0).getDate();
            const targetDate = new Date(targetMonth.getFullYear(), targetMonth.getMonth(), Math.min(day, lastDay));
            window.viewDate = targetDate;
            window.selectedDateStr = window.normalizeDate(targetDate);
            window.checkSemesterSwitch(window.viewDate);
            window.refreshUI();
        };
        window.goToToday = () => {
            window.viewDate = new Date();
            window.selectedDateStr = window.todayStr;
            window.checkSemesterSwitch(window.viewDate);
            window.refreshUI();
        };

        window.handleSign = async (dateToSign) => {
            if(!checkFbAuth() || !window.currentUser) return;
            const btn = document.getElementById('signBtn');
            btn.disabled = true; btn.innerHTML = '<span class="loading-spinner mx-auto"></span>';
            try {
                const docId = `${window.toDocId(dateToSign)}_${window.currentUser.studentId}`;
                const docRef = doc(db, 'artifacts', window.fbAppId, 'public', 'data', 'daily_records', docId);
                await setDoc(docRef, { date: dateToSign, studentId: window.currentUser.studentId, signed: true, isLeave: false, signTime: window.getPreciseTime() }, { merge: true });
                Swal.fire({ icon: 'success', title: '簽署成功', text: `${dateToSign} 已完成確認`, showConfirmButton: false, timer: 1500 });
            } catch (err) {
                btn.disabled = false; btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>確認並簽署聯絡簿';
                Swal.fire('系統錯誤', '簽署失敗：' + err.message, 'error');
            }
        };

        window.handleLeave = async (dateToManage, shouldLeave) => {
            if (!checkFbAuth() || !window.currentUser) return;
            if (dateToManage < window.todayStr) {
                Swal.fire('無法設定', '只能登記今天或未來日期的請假。', 'info');
                return;
            }
            const actionLabel = shouldLeave ? '登記請假' : '取消請假登記';
            const confirmation = await Swal.fire({
                icon: 'question',
                title: actionLabel,
                text: shouldLeave ? `${dateToManage} 將標記為請假，當日無須簽閱。` : `${dateToManage} 將恢復為一般出席狀態。`,
                showCancelButton: true,
                confirmButtonText: '確認',
                cancelButtonText: '返回',
                confirmButtonColor: shouldLeave ? '#2563eb' : '#64748b'
            });
            if (!confirmation.isConfirmed) return;

            const button = document.getElementById('leaveBtn');
            if (button) { button.disabled = true; button.innerHTML = '<span class="loading-spinner mx-auto"></span>'; }
            try {
                const docId = `${window.toDocId(dateToManage)}_${window.currentUser.studentId}`;
                const docRef = doc(db, 'artifacts', window.fbAppId, 'public', 'data', 'daily_records', docId);
                await setDoc(docRef, {
                    date: dateToManage,
                    studentId: window.currentUser.studentId,
                    signed: false,
                    isLeave: shouldLeave,
                    leaveTime: window.getPreciseTime()
                }, { merge: true });
                Swal.fire({ icon: 'success', title: shouldLeave ? '已登記請假' : '已取消請假', showConfirmButton: false, timer: 1300 });
            } catch (error) {
                if (button) { button.disabled = false; button.textContent = shouldLeave ? '我要登記請假' : '取消請假登記'; }
                Swal.fire('系統錯誤', error.message || '請假設定失敗，請再試一次。', 'error');
            }
        };
    </script>

        <div class="hidden w-full max-w-sm fade-in my-auto">
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-[1.4rem] shadow-sm mb-4 border border-slate-100">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
                </div>
                <h1 class="text-3xl font-semibold tracking-tight text-black">807｜班級資訊動態</h1>
                <p class="text-[#8e8e93] mt-2 text-sm">請輸入學生資料進行登入</p>
                <div class="mt-4 text-xs font-bold text-[#d97706] bg-amber-50 inline-block px-3 py-1 rounded-full" id="dbStatusBadge">
                    連線準備中...
                </div>
                <script>
                    setTimeout(() => {
                        const badge = document.getElementById('dbStatusBadge');
                        if(badge && window.semesterData) badge.innerText = `目前學年度：${window.semesterData.semesterName}`;
                    }, 500);
                </script>
            </div>
            
            <div class="bg-white rounded-xl overflow-hidden shadow-sm border border-[#e5e5ea] mb-6">
                <div class="px-4 py-3 border-b border-[#e5e5ea] flex items-center">
                    <label class="w-24 text-[15px] text-black shrink-0">學號</label>
                    <input type="tel" inputmode="numeric" pattern="[0-9]*" id="studentId" class="flex-1 bg-transparent outline-none text-[15px] placeholder-[#c7c7cc]" placeholder="例如: 1410700">
                </div>
                <div class="px-4 py-3 flex items-center relative">
                    <label class="w-24 text-[15px] text-black shrink-0">密碼</label>
                    <input type="password" id="idNumber" class="flex-1 bg-transparent outline-none text-[15px] placeholder-[#c7c7cc] pr-10" placeholder="身分證字號">
                    <button type="button" onclick="window.togglePasswordVisibility()" class="absolute right-4 text-[#8e8e93] hover:text-[#d97706] focus:outline-none">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between px-2 mb-8">
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="rememberMe" class="custom-checkbox">
                    <label for="rememberMe" class="text-[15px] text-[#3c3c43] cursor-pointer select-none">記住登入資訊</label>
                </div>
            </div>

            <button id="loginBtn" onclick="window.handleLogin()" class="w-full bg-[#d97706] hover:bg-[#b45309] text-white font-semibold py-3.5 rounded-xl transition-all active:scale-[0.98] flex justify-center items-center gap-2 text-[17px]">登入系統</button>
            <p id="loginError" class="text-[#ff3b30] text-center text-sm mt-4 hidden font-medium"></p>
        </div>
    </div>

    <div id="mainPage" class="hidden flex-1 flex flex-col h-full w-full overflow-hidden">
        
        <nav class="bg-[#f2f2f7]/95 backdrop-blur-xl border-b border-[#e5e5ea] px-3 py-2.5 shrink-0 z-50">
            <div class="max-w-6xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-1 bg-[#e5e5ea]/80 p-1 rounded-xl w-full max-w-[400px] justify-between">
                    <button onclick="window.switchTab('calendar')" id="tabCalendar" class="px-2 sm:px-4 py-1.5 text-[13px] sm:text-[15px] font-bold rounded-lg bg-white shadow-sm text-[#d97706] transition-all whitespace-nowrap">行事曆</button>
                    <button onclick="window.switchTab('book')" id="tabContactBook" class="px-2 sm:px-4 py-1.5 text-[13px] sm:text-[15px] font-bold rounded-lg text-[#8e8e93] hover:text-[#1c1c1e] transition-all whitespace-nowrap">聯絡簿</button>
                    <button onclick="window.switchTab('group')" id="tabGroup" class="px-2 sm:px-4 py-1.5 text-[13px] sm:text-[15px] font-bold rounded-lg text-[#8e8e93] hover:text-[#1c1c1e] transition-all relative whitespace-nowrap">
                        班群
                        <span class="absolute top-1 right-1 w-2 h-2 rounded-full bg-[#ff3b30] hidden shadow-sm" id="groupUnreadBadge"></span>
                    </button>
                    <button onclick="window.switchTab('private')" id="tabPrivate" class="px-2 sm:px-4 py-1.5 text-[13px] sm:text-[15px] font-bold rounded-lg text-[#8e8e93] hover:text-[#1c1c1e] transition-all relative whitespace-nowrap">
                        私訊
                        <span class="absolute top-1 right-1 w-2 h-2 rounded-full bg-[#ff3b30] hidden shadow-sm" id="privateUnreadBadge"></span>
                    </button>
                </div>
                
                <div class="flex items-center pl-2">
                    <button onclick="window.goToUnifiedLogin()" aria-label="登出" title="登出" class="text-[#8e8e93] font-medium hover:text-[#ff3b30] transition-colors"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
                </div>
            </div>
        </nav>

        <!-- [分頁 1]：聯絡簿 -->
        <main id="bookPage" class="flex-1 w-full max-w-6xl mx-auto flex flex-col lg:flex-row overflow-hidden min-h-0 relative">
            <div class="w-full lg:w-80 border-b lg:border-b-0 lg:border-r border-[#e5e5ea] bg-[#f2f2f7] shrink-0 flex flex-col max-h-[45vh] lg:max-h-none overflow-y-auto custom-scrollbar z-10 shadow-sm lg:shadow-none relative">
                <div class="sticky top-0 bg-[#f2f2f7] z-20 px-4 py-3 flex justify-between items-center border-b border-[#e5e5ea]/50 shadow-[0_2px_4px_rgba(0,0,0,0.02)]">
                    <h3 id="currentMonthDisplay" class="font-bold text-[20px] lg:text-[22px] tracking-tight text-slate-800 bg-[#f2f2f7]"></h3>
                    <div class="flex items-center gap-1">
                        <button id="goTodayButton" onclick="window.goToToday()" class="text-[#d97706] bg-amber-50 hover:bg-amber-100 px-2.5 py-1.5 rounded-lg text-xs font-bold transition-colors">今日</button>
                        <button onclick="window.changeMonth(-1)" title="上個月" aria-label="上個月" class="text-[#d97706] hover:bg-black/5 w-10 h-10 flex items-center justify-center rounded-lg transition-colors"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
                        <button onclick="window.changeMonth(1)" title="下個月" aria-label="下個月" class="text-[#d97706] hover:bg-black/5 w-10 h-10 flex items-center justify-center rounded-lg transition-colors"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
                    </div>
                </div>

                <div class="p-3 lg:p-4">
                    <div class="bg-white rounded-2xl p-3 shadow-sm border border-[#e5e5ea]">
                        <div class="calendar-header"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
                        <div id="calendarGrid" class="grid grid-cols-7 gap-1"></div>
                    </div>
                    <div class="mt-3 px-3 py-3 bg-white/50 rounded-xl border border-[#e5e5ea] grid grid-cols-2 gap-y-2 gap-x-1 text-[11px] lg:text-[13px]">
                        <div class="flex items-center gap-2 col-span-2"><p class="font-bold text-black uppercase tracking-widest text-[10px]">圖例說明</p></div>
                        <div class="flex items-center gap-2"><div class="w-2.5 h-2.5 bg-[#a855f7] rounded-full shrink-0"></div> <span class="truncate">有行事曆</span></div>
                        <div class="flex items-center gap-2"><div class="w-2.5 h-2.5 bg-[#007aff] rounded-full shrink-0"></div> <span class="truncate">有公告事項</span></div>
                        <div class="flex items-center gap-2"><div class="w-3 h-3 border-2 border-[#f59e0b] rounded-full shrink-0"></div> <span class="truncate">當日請假</span></div>
                        <div class="flex items-center gap-2"><div class="w-2.5 h-2.5 bg-[#ff3b30] rounded-full animate-pulse shrink-0"></div> <span class="text-[#ff3b30] font-bold truncate">逾期未簽</span></div>
                    </div>
                </div>
            </div>

            <div class="flex-1 bg-white flex flex-col min-h-0 overflow-hidden relative">
                <div id="contentContainer" class="flex-1 overflow-y-auto custom-scrollbar p-5 lg:p-12 fade-in"></div>
                <div id="footerAction" class="shrink-0 bg-white border-t border-[#e5e5ea] p-4 lg:p-6 shadow-[0_-5px_20px_rgba(0,0,0,0.05)] z-20 pb-[max(1rem,env(safe-area-inset-bottom))]"></div>
            </div>
        </main>

        <!-- [分頁 2]：班級群聊 (支援傳送圖片) -->
        <main id="groupChatPage" class="hidden flex-1 w-full max-w-2xl mx-auto chat-bg flex-col overflow-hidden min-h-0 relative shadow-sm lg:border-x border-white/20">
            <div class="px-5 py-3 bg-white/10 backdrop-blur-md border-b border-white/10 flex justify-between items-center shrink-0 z-10 shadow-sm">
                <h3 class="font-bold text-white flex items-center gap-2 text-[17px]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 6.1H3"/><path d="M21 12.1H3"/><path d="M15.1 18H3"/></svg>
                    班級家長交流群
                </h3>
            </div>
            <div id="groupChatScrollArea" class="flex-1 overflow-y-auto custom-scrollbar p-4 flex flex-col relative scroll-smooth">
                <div id="groupChatMessageList" class="flex flex-col min-h-full justify-end"></div>
            </div>
            
            <div id="groupChatInputArea" class="mt-auto p-3 bg-[#f2f2f7] shrink-0 border-t border-gray-300 z-20 pb-[max(0.75rem,env(safe-area-inset-bottom))]">
                <div class="flex gap-2 items-end bg-white rounded-[20px] p-1.5 border border-gray-200">
                    
                    <!-- 📸 圖片上傳按鈕 -->
                    <label class="hidden w-[42px] h-[42px] shrink-0 hover:bg-slate-100 rounded-full flex items-center justify-center transition-transform active:scale-90 mb-0.5 cursor-pointer text-slate-500">
                        <input type="file" accept="image/*" class="hidden" onchange="window.handleImageUpload(this, 'group')">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2z"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    </label>

                    <textarea 
                        id="groupChatInput" 
                        rows="1" 
                        oninput="this.style.height='auto'; this.style.height=(this.scrollHeight)+'px';" 
                        onkeypress="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); window.sendGroupChatMessage();}" 
                        placeholder="在此輸入群組訊息..." 
                        class="flex-1 bg-transparent border-none resize-none pl-1 pr-1 py-2.5 text-[15px] outline-none max-h-[120px] min-h-[44px] overflow-y-auto leading-relaxed"
                    ></textarea>
                    <button 
                        onclick="window.sendGroupChatMessage()" 
                        class="w-[42px] h-[42px] shrink-0 bg-[#00c300] hover:bg-[#00a000] text-white rounded-full flex items-center justify-center transition-transform active:scale-90 mb-0.5"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="ml-0.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>
        </main>

        <!-- [分頁 3]：私訊老師 (支援傳送圖片) -->
        <main id="privateChatPage" class="hidden flex-1 w-full max-w-2xl mx-auto private-bg flex-col overflow-hidden min-h-0 relative shadow-sm lg:border-x border-slate-200">
            <div class="px-5 py-3 bg-white/90 backdrop-blur-md border-b border-slate-200 flex justify-between items-center gap-3 shrink-0 z-10 shadow-sm">
                <h3 class="font-bold text-slate-800 flex items-center gap-2 text-[17px]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-500"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><path d="M13 8H7"></path><path d="M17 8h.01"></path></svg>
                    與老師的私密對話
                </h3>
                <button id="parentVoiceRequestButton" type="button" onclick="window.requestVoiceCall()" class="shrink-0 min-h-10 rounded-xl bg-emerald-50 px-3 text-sm font-black text-emerald-700 active:scale-[.98] disabled:active:scale-100">申請通話</button>
            </div>
            <div id="privateChatScrollArea" class="flex-1 overflow-y-auto custom-scrollbar p-4 flex flex-col relative scroll-smooth bg-slate-50/50">
                <div id="privateChatMessageList" class="flex flex-col min-h-full justify-end"></div>
            </div>
            <div id="privateChatInputArea" class="mt-auto p-3 bg-white shrink-0 border-t border-slate-200 z-20 pb-[max(0.75rem,env(safe-area-inset-bottom))]">
                <div class="flex gap-2 items-end bg-slate-50 rounded-[20px] p-1.5 border border-slate-200 focus-within:border-blue-300 focus-within:ring-1 transition-all">
                    
                    <!-- 📸 圖片上傳按鈕 -->
                    <label class="hidden w-[42px] h-[42px] shrink-0 hover:bg-slate-200 rounded-full flex items-center justify-center transition-transform active:scale-90 mb-0.5 cursor-pointer text-slate-500">
                        <input type="file" accept="image/*" class="hidden" onchange="window.handleImageUpload(this, 'private')">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2z"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    </label>

                    <textarea 
                        id="privateChatInput" 
                        rows="1" 
                        oninput="this.style.height='auto'; this.style.height=(this.scrollHeight)+'px';" 
                        onkeypress="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); window.sendPrivateChatMessage();}" 
                        placeholder="輸入要私下傳給老師的話..." 
                        class="flex-1 bg-transparent border-none resize-none pl-1 pr-1 py-2.5 text-[15px] outline-none max-h-[120px] min-h-[44px] overflow-y-auto leading-relaxed"
                    ></textarea>
                    <button 
                        onclick="window.sendPrivateChatMessage()" 
                        class="w-[42px] h-[42px] shrink-0 bg-blue-600 hover:bg-blue-700 text-white rounded-full flex items-center justify-center transition-transform active:scale-90 mb-0.5"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="ml-0.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>
        </main>

    </div>

    <div id="parentVoiceCallModal" class="hidden fixed inset-0 z-[200] bg-slate-950/75 backdrop-blur-sm p-5 items-center justify-center" role="dialog" aria-modal="true" aria-labelledby="parentVoiceCallTitle">
        <section class="w-full max-w-sm rounded-[2rem] bg-white p-6 text-center shadow-2xl">
            <div class="mx-auto mb-5 flex h-20 w-20 items-center justify-center rounded-full bg-emerald-100 text-emerald-600"><svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.62a2 2 0 0 1-.45 2.11L8.01 9.72a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.84.29 1.72.5 2.62.62A2 2 0 0 1 22 16.92z"/></svg></div>
            <p class="text-sm font-bold text-slate-400">一對一語音通話</p>
            <h2 id="parentVoiceCallTitle" class="mt-1 text-2xl font-black text-slate-800">老師來電</h2>
            <p id="parentVoiceCallStatus" class="mt-3 min-h-12 text-sm leading-relaxed text-slate-500">老師正在邀請您進行語音通話。</p>
            <div id="parentVoiceCallActions" class="mt-5 grid grid-cols-2 gap-3">
                <button type="button" onclick="window.declineVoiceCall()" class="min-h-14 rounded-2xl bg-slate-100 font-black text-slate-600 active:scale-[.98]">拒接</button>
                <button type="button" onclick="window.acceptVoiceCall()" class="min-h-14 rounded-2xl bg-emerald-600 font-black text-white shadow-lg shadow-emerald-200 active:scale-[.98]">接聽</button>
            </div>
            <button id="parentVoiceCallHangup" type="button" onclick="window.endParentVoiceCall('ended')" class="hidden mt-5 min-h-14 w-full rounded-2xl bg-rose-600 font-black text-white shadow-lg shadow-rose-200 active:scale-[.98]">結束通話</button>
        </section>
    </div>
    <audio id="parentRemoteAudio" autoplay playsinline></audio>
</body>
</html>

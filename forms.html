<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>807 班級聯絡簿｜表單</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --app-height: 100dvh; }
    html, body { min-height: var(--app-height); background: #f2f2f7; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; }
  </style>
</head>
<body class="min-h-screen text-slate-800">
  <main class="mx-auto flex min-h-screen w-full max-w-2xl flex-col">
    <header class="sticky top-0 z-10 flex items-center gap-3 border-b border-slate-200 bg-white/95 px-4 py-3 backdrop-blur">
      <button type="button" onclick="window.backToGroup()" class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-slate-100 text-lg font-black text-slate-600" aria-label="返回">‹</button>
      <div class="min-w-0"><p class="text-xs font-black tracking-widest text-blue-600">CLASS FORM</p><h1 class="truncate text-lg font-black">班級表單</h1></div>
    </header>
    <section id="loading" class="m-auto w-full px-5 text-center">
      <div class="mx-auto h-12 w-12 animate-spin rounded-full border-4 border-blue-100 border-t-blue-600"></div>
      <p class="mt-4 font-bold text-slate-500">正在開啟表單…</p>
    </section>
    <section id="error" class="hidden m-auto w-full px-5 text-center"></section>
    <section id="formPage" class="hidden flex-1 px-4 py-5 pb-[max(1.5rem,env(safe-area-inset-bottom))]">
      <div class="rounded-3xl bg-white p-5 shadow-sm ring-1 ring-slate-200">
        <p id="deadline" class="hidden mb-3 w-fit rounded-full bg-amber-50 px-3 py-1 text-xs font-black text-amber-700"></p>
        <h2 id="formTitle" class="text-2xl font-black leading-tight"></h2>
        <p id="formDescription" class="mt-3 whitespace-pre-wrap text-sm leading-relaxed text-slate-500"></p>
        <div class="mt-5 rounded-2xl bg-blue-50 p-4 text-sm">
          <p class="font-black text-blue-800">已自動帶入填寫人資料</p>
          <p id="identity" class="mt-1 font-bold text-blue-700"></p>
          <p class="mt-1 text-xs text-blue-600">不需要再次填寫學號或姓名。</p>
        </div>
        <div class="mt-6"><div class="flex items-center justify-between text-xs font-black text-slate-400"><span id="formProgressText">第 1 題</span><span id="formProgressCount"></span></div><div class="mt-2 h-2 overflow-hidden rounded-full bg-slate-100"><div id="formProgressBar" class="h-full rounded-full bg-blue-600 transition-all duration-300"></div></div></div>
        <form id="responseForm" class="mt-6"></form>
        <div id="formNavigator" class="mt-6"></div>
        <p id="status" class="hidden mt-3 rounded-xl px-3 py-2 text-center text-sm font-bold"></p>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, setPersistence, browserSessionPersistence, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyD_IvR1rEMxDSw3Fv_3zkM1mGetMQv8gg8',
      authDomain: 'classcontact-c148d.firebaseapp.com',
      projectId: 'classcontact-c148d',
      storageBucket: 'classcontact-c148d.firebasestorage.app',
      messagingSenderId: '559132828543',
      appId: '1:559132828543:web:a47598010956175eda304a'
    };
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzQBi-uoqSy73_VUD2xCpXqx2qPfARxvXxUFJwsd8wf_FcVkehubPpaDA0RQVgI11ky/exec';
    const FORM_APP_ID = 'contact-forms';
    const formId = new URLSearchParams(location.search).get('id');
    const sessionToken = sessionStorage.getItem('contact-book-session');
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let currentUser = null;
    let currentForm = null;
    let previousAnswers = {};

    window.backToGroup = () => {
      if (history.length > 1) history.back();
      else location.assign('./guardians.html');
    };

    const showError = message => {
      document.getElementById('loading').classList.add('hidden');
      const box = document.getElementById('error');
      box.innerHTML = `<div class="rounded-3xl bg-white p-6 shadow-sm ring-1 ring-slate-200"><div class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-red-50 text-2xl font-black text-red-500">!</div><h2 class="mt-4 text-xl font-black">無法開啟表單</h2><p class="mt-2 text-sm leading-relaxed text-slate-500"></p><button type="button" onclick="window.backToGroup()" class="mt-6 min-h-12 w-full rounded-2xl bg-slate-800 font-black text-white">返回班群</button></div>`;
      box.querySelector('p').textContent = message;
      box.classList.remove('hidden');
    };
    const setStatus = (message, type = 'info') => {
      const el = document.getElementById('status');
      el.textContent = message;
      el.className = `mt-3 rounded-xl px-3 py-2 text-center text-sm font-bold ${type === 'error' ? 'bg-red-50 text-red-700' : 'bg-emerald-50 text-emerald-700'}`;
      el.classList.remove('hidden');
    };
    const escapeHtml = value => String(value || '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
    const normalizeFields = fields => Array.isArray(fields) ? fields.filter(field => field && field.label) : [];
    const isExpired = form => form.deadline && new Date(`${form.deadline}T23:59:59`).getTime() < Date.now();

    function renderForm() {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('formPage').classList.remove('hidden');
      document.getElementById('formTitle').textContent = currentForm.title;
      document.getElementById('formDescription').textContent = currentForm.description || '';
      document.getElementById('identity').textContent = `${currentUser.seatNo ? `${currentUser.seatNo} 號　` : ''}${currentUser.name || '家長'}`;
      const deadline = document.getElementById('deadline');
      deadline.classList.toggle('hidden', !currentForm.deadline);
      if (currentForm.deadline) deadline.textContent = `填寫期限：${currentForm.deadline}`;
      currentQuestionIndex = 0;
      const isPublished = currentForm.status === 'published' || currentForm.status === 'open';
      formReadOnly = !isPublished || isExpired(currentForm) || !normalizeFields(currentForm.fields).length;
      renderCurrentFormStep();
      if (formReadOnly) setStatus(!isPublished ? '此表單尚未發佈或已關閉。' : isExpired(currentForm) ? '此表單已超過填寫期限。' : '此表單尚未設定可填寫題目。', 'error');
    }

    let currentQuestionIndex = 0;
    let formReadOnly = false;
    const getFields = () => normalizeFields(currentForm?.fields);
    const otherOptionFor = field => {
      const lastOption = (field.options || []).at(-1);
      return String(lastOption || '').trim().startsWith('其他') ? lastOption : '';
    };
    const isOtherAnswer = (field, value) => Boolean(otherOptionFor(field)) && String(value || '').trim().startsWith('其他');
    const otherTextFor = (field, value) => {
      const answer = String(value || '').trim();
      const marker = `${otherOptionFor(field)}：`;
      return answer.startsWith(marker) ? answer.slice(marker.length) : '';
    };
    const isAnswerComplete = (field, value) => {
      const answer = String(value || '').trim();
      if (!answer) return false;
      if (!isOtherAnswer(field, answer)) return true;
      return otherTextFor(field, answer).trim().length > 0;
    };

    function renderCurrentFormStep() {
      const fields = getFields();
      const isReview = currentQuestionIndex >= fields.length;
      const progressText = document.getElementById('formProgressText');
      const progressCount = document.getElementById('formProgressCount');
      const progressBar = document.getElementById('formProgressBar');
      const form = document.getElementById('responseForm');
      const navigator = document.getElementById('formNavigator');
      if (!fields.length) {
        progressText.textContent = '尚未設定題目';
        progressCount.textContent = '';
        progressBar.style.width = '0%';
        form.innerHTML = '<p class="rounded-xl bg-slate-50 p-4 text-sm text-slate-500">此表單尚未設定題目。</p>';
        navigator.innerHTML = '';
        return;
      }
      progressText.textContent = isReview ? '確認答案' : `第 ${currentQuestionIndex + 1} 題`;
      progressCount.textContent = isReview ? `共 ${fields.length} 題` : `${currentQuestionIndex + 1}／${fields.length}`;
      progressBar.style.width = `${isReview ? 100 : ((currentQuestionIndex + 1) / fields.length) * 100}%`;
      if (isReview) {
        form.innerHTML = `<div class="rounded-2xl bg-slate-50 p-4"><h3 class="font-black text-slate-900">請確認填寫內容</h3><div class="mt-4 space-y-4">${fields.map((field, index) => `<div><p class="text-xs font-black text-slate-400">${index + 1}. ${escapeHtml(field.label)}</p><p class="mt-1 break-words font-bold text-slate-700">${escapeHtml(previousAnswers[field.id] || '未填寫')}</p></div>`).join('')}</div></div>`;
        navigator.innerHTML = `<div class="grid grid-cols-2 gap-3"><button type="button" onclick="window.goToPreviousQuestion()" class="min-h-13 rounded-2xl bg-slate-100 px-4 py-3 font-black text-slate-700 active:scale-[.98]">上一步</button><button id="submitButton" type="button" onclick="window.submitForm()" ${formReadOnly ? 'disabled' : ''} class="min-h-13 rounded-2xl bg-blue-600 px-4 py-3 font-black text-white shadow-lg shadow-blue-200 active:scale-[.98] ${formReadOnly ? 'opacity-50' : ''}">確認送出</button></div>`;
        return;
      }
      const field = fields[currentQuestionIndex];
      const answer = previousAnswers[field.id] || '';
      const label = `${currentQuestionIndex + 1}. ${escapeHtml(field.label)}`;
      if (field.type === 'select') {
        const otherOption = otherOptionFor(field);
        const selectedOther = isOtherAnswer(field, answer);
        const otherText = selectedOther ? otherTextFor(field, answer) : '';
        form.innerHTML = `<div><h3 class="text-xl font-black leading-snug text-slate-900">${label}</h3><p class="mt-2 text-sm text-slate-500">請選擇一個答案</p><div class="mt-5 space-y-3">${(field.options || []).map(option => `<button type="button" data-choice-value="${escapeHtml(option)}" class="form-choice min-h-14 w-full rounded-2xl border-2 px-4 text-left text-[16px] font-black transition active:scale-[.98] ${(option === answer || (option === otherOption && selectedOther)) ? 'border-blue-600 bg-blue-50 text-blue-800' : 'border-slate-200 bg-white text-slate-700'}" ${formReadOnly ? 'disabled' : ''}>${escapeHtml(option)}</button>`).join('')}</div>${selectedOther ? `<label class="mt-4 block"><span class="text-sm font-black text-slate-700">請填寫其他內容</span><input id="otherTextAnswer" value="${escapeHtml(otherText)}" ${formReadOnly ? 'disabled' : ''} type="text" class="mt-2 min-h-14 w-full rounded-2xl border-2 border-blue-200 bg-blue-50 px-4 text-[16px] font-medium outline-none focus:border-blue-500" placeholder="請輸入其他內容"></label>` : ''}</div>`;
        form.querySelectorAll('[data-choice-value]').forEach(button => button.addEventListener('click', () => window.chooseFormAnswer(field.id, button.dataset.choiceValue)));
        form.querySelector('#otherTextAnswer')?.addEventListener('input', event => { previousAnswers[field.id] = `${otherOption}：${event.target.value}`; });
      } else {
        form.innerHTML = `<label class="block"><span class="text-xl font-black leading-snug text-slate-900">${label}</span><p class="mt-2 text-sm text-slate-500">請填寫答案</p><input id="currentTextAnswer" value="${escapeHtml(answer)}" ${formReadOnly ? 'disabled' : ''} type="text" class="mt-5 min-h-14 w-full rounded-2xl border-2 border-slate-200 px-4 text-[16px] font-medium outline-none focus:border-blue-500" placeholder="請輸入答案"></label>`;
        form.querySelector('#currentTextAnswer')?.addEventListener('input', event => { previousAnswers[field.id] = event.target.value; });
      }
      navigator.innerHTML = `<div class="grid ${currentQuestionIndex ? 'grid-cols-2' : 'grid-cols-1'} gap-3">${currentQuestionIndex ? '<button type="button" onclick="window.goToPreviousQuestion()" class="min-h-13 rounded-2xl bg-slate-100 px-4 py-3 font-black text-slate-700 active:scale-[.98]">上一步</button>' : ''}<button type="button" onclick="window.goToNextQuestion()" ${formReadOnly ? 'disabled' : ''} class="min-h-13 rounded-2xl bg-blue-600 px-4 py-3 font-black text-white shadow-lg shadow-blue-200 active:scale-[.98] ${formReadOnly ? 'opacity-50' : ''}">${currentQuestionIndex === fields.length - 1 ? '確認答案' : '下一步'}</button></div>`;
    }

    window.chooseFormAnswer = (fieldId, value) => {
      if (formReadOnly) return;
      const field = getFields().find(item => item.id === fieldId);
      previousAnswers[fieldId] = field && value === otherOptionFor(field) ? `${value}：` : value;
      document.getElementById('status').classList.add('hidden');
      renderCurrentFormStep();
    };
    window.goToNextQuestion = () => {
      if (formReadOnly) return;
      const field = getFields()[currentQuestionIndex];
      if (!field || !isAnswerComplete(field, previousAnswers[field.id])) return setStatus(isOtherAnswer(field, previousAnswers[field.id]) ? '請填寫其他內容後再繼續。' : '請選擇或填寫答案後再繼續。', 'error');
      currentQuestionIndex += 1;
      document.getElementById('status').classList.add('hidden');
      renderCurrentFormStep();
    };
    window.goToPreviousQuestion = () => {
      currentQuestionIndex = Math.max(0, currentQuestionIndex - 1);
      document.getElementById('status').classList.add('hidden');
      renderCurrentFormStep();
    };

    window.submitForm = async () => {
      if (!currentForm || !['published', 'open'].includes(currentForm.status) || isExpired(currentForm)) return;
      const answers = {};
      for (const field of getFields()) {
        const value = String(previousAnswers[field.id] || '').trim();
        if (!isAnswerComplete(field, value)) return setStatus('請完成所有題目後再送出。', 'error');
        answers[field.id] = value;
      }
      const button = document.getElementById('submitButton');
      button.disabled = true;
      button.textContent = '送出中…';
      try {
        await setDoc(doc(db, 'artifacts', FORM_APP_ID, 'public', 'data', 'forms', formId, 'submissions', String(currentUser.studentId)), {
          studentId: String(currentUser.studentId),
          studentName: String(currentUser.name || ''),
          seatNo: String(currentUser.seatNo || ''),
          answers,
          submittedAt: Date.now(),
          formTitle: currentForm.title
        }, { merge: true });
        previousAnswers = answers;
        setStatus('已送出回覆，若需要可再次開啟修改。');
      } catch (error) {
        setStatus(error.message || '送出失敗，請確認網路後再試。', 'error');
      } finally {
        button.disabled = false;
        button.textContent = '送出回覆';
      }
    };

    async function openForm() {
      if (!formId || !sessionToken) return showError('請先從統一登入頁登入後，再開啟表單連結。');
      try {
        const response = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: 'validateSession', sessionToken }) });
        const session = await response.json();
        if (!session.success || session.role !== 'parent' || !session.user || !session.firebaseToken) throw new Error('登入已過期，請重新登入。');
        currentUser = session.user;
        await setPersistence(auth, browserSessionPersistence);
        await signInWithCustomToken(auth, session.firebaseToken);
        const formRef = doc(db, 'artifacts', FORM_APP_ID, 'public', 'data', 'forms', formId);
        const formSnapshot = await getDoc(formRef);
        if (!formSnapshot.exists()) throw new Error('此表單已被教師刪除或不存在。');
        currentForm = { id: formSnapshot.id, ...formSnapshot.data() };
        const submissionSnapshot = await getDoc(doc(formRef, 'submissions', String(currentUser.studentId)));
        previousAnswers = submissionSnapshot.exists() ? (submissionSnapshot.data().answers || {}) : {};
        renderForm();
      } catch (error) {
        console.error(error);
        showError(error.message || '請稍後再試。');
      }
    }
    openForm();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
    }
  </script>
</body>
</html>

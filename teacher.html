                if (isExpanded) {
                    let lastDate = '';
                    monthMsgs.forEach(msg => {
                        const msgDate = msg.timestamp.split(' ')[0];
                        const msgTime = msg.timestamp.split(' ')[1];
                        const isMe = msg.sender === 'teacher';
                        const isImage = msg.messageType === 'image';
                        
                        if(msgDate !== lastDate) {
                            html += `<div class="text-center my-4"><span class="bg-slate-200 text-slate-500 text-xs font-medium px-3 py-1 rounded-full shadow-sm">${msgDate}</span></div>`;
                            lastDate = msgDate;
                        }

                        const bubbleContent = isImage 
                            ? `<img src="${msg.text}" onclick="window.previewImage('${msg.text}')" class="max-w-[200px] sm:max-w-[280px] rounded-xl cursor-zoom-in hover:brightness-95 transition-all shadow-sm border border-slate-200" alt="圖片載入中..." onerror="this.onerror=null; this.src='https://placehold.co/300?text=圖片載入失敗';"/>`
                            : msg.text;

                        if(isMe) {
                            html += `
                                <div class="flex justify-end mb-4 pl-12 fade-in">
                                    <div class="flex items-end gap-1.5">
                                        <span class="text-[10px] text-slate-400 mb-1 font-medium">${msgTime}</span>
                                        <div class="${isImage ? 'bg-transparent p-0' : 'chat-bubble-me px-4 py-2.5 rounded-2xl rounded-tr-sm shadow-sm'} max-w-full break-words text-[15px] leading-relaxed relative">
                                            ${bubbleContent}
                                        </div>
                                    </div>
                                </div>
                            `;
                        } else {
                            const shortName = msg.name ? (msg.name.length >= 2 ? msg.name.slice(-2) : msg.name) : (msg.studentId || "未知");
                            const displayName = `${shortName} (家長)`;
                            const displaySeat = msg.seatNo ? String(msg.seatNo).padStart(2, '0') : (msg.studentId ? msg.studentId.slice(-3) : "?");

                            html += `
                                <div class="flex justify-start mb-4 pr-12 fade-in">
                                    <div class="w-9 h-9 rounded-full bg-slate-200 flex items-center justify-center text-slate-600 text-[13px] font-bold shrink-0 mr-2 shadow-sm mt-1 border border-slate-300">
                                        ${displaySeat}
                                    </div>
                                    <div>
                                        <div class="text-xs text-slate-500 ml-1 mb-1 font-medium">${displayName}</div>
                                        <div class="flex items-end gap-1.5">
                                            <div class="${isImage ? 'bg-transparent p-0 border-none shadow-none' : 'bg-white border border-slate-200 text-slate-800 px-4 py-2.5 rounded-2xl rounded-tl-sm shadow-sm'} max-w-full break-words text-[15px] leading-relaxed relative">
                                                ${bubbleContent}
                                            </div>
                                            <span class="text-[10px] text-slate-400 mb-1 font-medium">${msgTime}</span>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }
                    });
                }
            });

            container.innerHTML = html;
        }

        // 🌟 點選特定家長
        window.setSignatureFilter = (filter) => {
            // 再點一次相同分類即可回到全部名單，方便單手快速切換。
            window.signatureFilter = window.signatureFilter === filter ? 'all' : filter;
            window.refreshUI();
        };

        window.openStudentPrivateChat = (studentId, studentName) => {
            window.switchTab('private');
            setTimeout(() => window.selectChatStudent(studentId, studentName), 0);
        };

        window.selectChatStudent = (studentId, shortName) => {
            window.activeChatStudentId = studentId;
            window.expandedPrivateMonths = null; 
            document.getElementById('activeChatHeader').innerHTML = `與 ${shortName} 家長私訊中`;
            
            const sidebar = document.getElementById('privateChatSidebar');
            const mainWin = document.getElementById('privateChatMainWindow');
            if (window.innerWidth < 768) {
                sidebar.classList.add('hidden');
                mainWin.classList.remove('hidden');
                mainWin.classList.add('flex');
            }
            window.refreshUI();
            setTimeout(window.scrollToPrivateChatBottom, 50);
        };

        window.backToChatList = () => {
            window.activeChatStudentId = null;
            const sidebar = document.getElementById('privateChatSidebar');
            const mainWin = document.getElementById('privateChatMainWindow');
            sidebar.classList.remove('hidden');
            mainWin.classList.add('hidden');
            mainWin.classList.remove('flex');
            window.refreshUI();
        };

        window.scrollToGroupChatBottom = () => {
            const container = document.getElementById('groupChatScrollArea');
            if(container) container.scrollTop = container.scrollHeight;
        };

        window.scrollToPrivateChatBottom = () => {
            const container = document.getElementById('privateChatScrollArea');
            if(container) container.scrollTop = container.scrollHeight;
        };

        // 🌟 放大圖片預覽
        window.previewImage = (url) => {
            Swal.fire({
                imageUrl: url,
                imageAlt: '圖片載入中',
                showConfirmButton: false,
                background: 'transparent',
                backdrop: 'rgba(0,0,0,0.85)',
                customClass: {
                    image: 'max-h-[85vh] object-contain rounded-xl'
                }
            });
        };

        // 🌟 處理老師端選擇圖片並非同步上傳
        window.setChatComposerLoading = (input, isLoading) => {
            const button = input && input.parentElement ? input.parentElement.querySelector('button') : null;
            if (!button) return;
            input.disabled = isLoading;
            button.disabled = isLoading;
            button.setAttribute('aria-busy', String(isLoading));
            button.classList.toggle('opacity-60', isLoading);
            if (isLoading) {
                button.dataset.originalHtml = button.innerHTML;
                button.innerHTML = '<span class="loading-spinner border-white/30 border-t-white !w-5 !h-5"></span>';
            } else if (button.dataset.originalHtml) {
                button.innerHTML = button.dataset.originalHtml;
                delete button.dataset.originalHtml;
            }
        };

        window.offerChatRetry = (title, retry) => {
            Swal.fire({
                icon: 'error',
                title: title,
                text: '請檢查網路後重試；原本的內容已保留。',
                showCancelButton: true,
                confirmButtonText: '重試',
                cancelButtonText: '稍後'
            }).then(result => { if (result.isConfirmed) retry(); });
        };

        window.offerImageRetry = (file, type) => {
            Swal.fire({
                icon: 'error',
                title: '圖片上傳失敗',
                text: '請檢查網路後重試；已選取的圖片會保留。',
                showCancelButton: true,
                confirmButtonText: '重試',
                cancelButtonText: '稍後'
            }).then(result => {
                if (result.isConfirmed) window.handleImageUpload({ files: [file], value: '' }, type, file);
            });
        };

        window.handleImageUpload = async (inputElement, type, retryFile = null) => {
            if(!checkFbAuth() || !fbUser) return;
            const file = retryFile || inputElement.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                Swal.fire('無法傳送', '照片檔案過大，請勿超過 5MB。', 'error');
                return;
            }

            Swal.fire({
                title: '上傳圖片中...',
                text: '正在將圖片儲存至 Google 雲端硬碟',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const base64Data = reader.result.split(',')[1];
                try {
                    const resp = await fetch(GAS_API_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'uploadImage',
                            sessionToken: window.sessionToken,
                            base64Data: base64Data,
                            fileName: `teacher_${Date.now()}.${file.name.split('.').pop()}`,
                            mimeType: file.type,
                            chatType: type, // 告知後端是 group 還是 private
                            studentId: window.activeChatStudentId // 提供當前私訊對象的學號
                        })
                    });
                    const res = await resp.json();

                    if (res.success && res.imageUrl) {
                        Swal.close();
                        if (type === 'group') {
                            await addDoc(collection(db, 'artifacts', window.CHAT_APP_ID, 'public', 'data', 'group_chat'), {
                                studentId: 'teacher',
                                name: '蘇老師',
                                seatNo: 'T',
                                sender: 'teacher',
                                text: res.imageUrl,
                                messageType: 'image',
                                timestamp: window.getPreciseTime()
                            });
                            setTimeout(window.scrollToGroupChatBottom, 100);
                        } else {
                            await addDoc(collection(db, 'artifacts', window.CHAT_APP_ID, 'public', 'data', 'private_chats'), {
                                studentId: window.activeChatStudentId,
                                sender: 'teacher',
                                name: '蘇老師',
                                seatNo: 'T',
                                text: res.imageUrl,
                                messageType: 'image',
                                timestamp: window.getPreciseTime()
                            });
                            setTimeout(window.scrollToPrivateChatBottom, 100);
                        }
                    } else {
                        throw new Error(res.message || '上傳失敗');
                    }
                } catch (e) {
                    console.error(e);
                    window.offerImageRetry(file, type);
                } finally {
                    inputElement.value = '';
                }
            };
        };

        window.sendGroupChatMessage = async (retryText = null) => {
            if(!checkFbAuth() || !fbUser) return;
            const input = document.getElementById('groupChatInput');
            const text = (retryText || input.value).trim();
            if(!text) return;
            
            window.setChatComposerLoading(input, true);
            try {
                await addDoc(collection(db, 'artifacts', window.CHAT_APP_ID, 'public', 'data', 'group_chat'), {
                    studentId: 'teacher',
                    name: '蘇老師',
                    seatNo: 'T', 
                    sender: 'teacher',
                    text: text,
                    messageType: 'text',
                    timestamp: window.getPreciseTime()
                });
                input.value = '';
                input.style.height = 'auto'; 
            } catch(e) {
                console.error(e);
                window.offerChatRetry('發送失敗', () => window.sendGroupChatMessage(text));
            } finally {
                window.setChatComposerLoading(input, false);
                setTimeout(() => {
                    input.focus();
                    window.scrollToGroupChatBottom();
                }, 50);
            }
        };

        window.sendPrivateMessage = async (retryText = null) => {
            if(!checkFbAuth() || !fbUser || !window.activeChatStudentId) return;
            const input = document.getElementById('privateChatInput');
            const text = (retryText || input.value).trim();
            if(!text) return;
            
            window.setChatComposerLoading(input, true);
            try {
                await addDoc(collection(db, 'artifacts', window.CHAT_APP_ID, 'public', 'data', 'private_chats'), {
                    studentId: window.activeChatStudentId,
                    sender: 'teacher',
                    name: '蘇老師',
                    seatNo: 'T',
                    text: text,
                    messageType: 'text',
                    timestamp: window.getPreciseTime()
                });
                input.value = '';
                input.style.height = 'auto'; 
            } catch(e) {
                console.error(e);
                window.offerChatRetry('發送失敗', () => window.sendPrivateMessage(text));
            } finally {
                window.setChatComposerLoading(input, false);
                setTimeout(() => {
                    input.focus();
                    window.scrollToPrivateChatBottom();
                }, 50);
            }
        };

        window.changeMonth = (offset) => { 
            window.viewDate.setMonth(window.viewDate.getMonth() + offset); 
            window.checkSemesterSwitch(window.viewDate);
            window.refreshUI(); 
        };
        
        window.clearInput = () => { 
            document.getElementById('tNoteInput').value = ""; 
            document.getElementById('tEventInput').value = ""; 
        };

        const checkFbAuth = () => {
            if(!fbUser) {
                Swal.fire({ title: '資料庫連線異常', html: '系統無法寫入資料。<br/><br/>若您將系統發布在 Google Sites，請至 Firebase 控制台加入白名單。', icon: 'error' });
                return false;
            }
            return true;
        };

        window.handleSaveNote = async () => {
            if(!checkFbAuth()) return;
            const btn = document.getElementById('saveBtn');
            const noteContent = document.getElementById('tNoteInput').value.trim();
            const eventContent = document.getElementById('tEventInput').value.trim();
            
            btn.disabled = true; btn.innerHTML = '<span class="loading-spinner w-4 h-4"></span> 儲存中...';
            try {
                const docId = window.toDocId(window.selectedDateStr);
                const noteRef = doc(db, 'artifacts', window.fbAppId, 'public', 'data', 'notes', docId);
                const eventRef = doc(db, 'artifacts', window.fbAppId, 'public', 'data', 'calendar_events', docId);
                
                await setDoc(noteRef, { content: noteContent }, { merge: true });
                
                if (eventContent) {
                    await setDoc(eventRef, { event: eventContent }, { merge: true });
                } else {
                    await deleteDoc(eventRef);
                }

                Swal.fire({ icon: 'success', title: '內容已成功發布', timer: 1500, showConfirmButton: false });
            } catch (err) {
                Swal.fire('發布失敗', err.message, 'error');
            } finally {
                btn.disabled = false; btn.innerHTML = '<i data-lucide="send" class="w-4 h-4"></i> 儲存並發布';
                lucide.createIcons();
            }
        };

        window.handleToggleHoliday = async (isHoliday) => {
            if(!checkFbAuth()) {
                document.getElementById('tHolidayToggle').checked = !isHoliday;
                return;
            }
            const docRef = doc(db, 'artifacts', window.fbAppId, 'public', 'data', 'holidays', window.toDocId(window.selectedDateStr));
            try {
                if(isHoliday) await setDoc(docRef, { isHoliday: true, date: window.selectedDateStr });
                else await deleteDoc(docRef);
                Swal.fire({ icon: 'success', title: '設定成功', text: isHoliday ? '已設為假日' : '已取消假日', timer: 1000, showConfirmButton: false });
            } catch (err) {
                Swal.fire('設定失敗', err.message, 'error');
                document.getElementById('tHolidayToggle').checked = !isHoliday;
            }
        };

        window.batchSetWeekends = async (isHoliday) => {
            if(!checkFbAuth()) return;
            const year = window.viewDate.getFullYear();
            const month = window.viewDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const weekendDates = [];

            for (let d = 1; d <= daysInMonth; d++) {
                const date = new Date(year, month, d);
                if (date.getDay() === 0 || date.getDay() === 6) {
                    weekendDates.push(window.normalizeDate(`${year}/${month + 1}/${d}`));
                }
            }
            if (weekendDates.length === 0) return;

            const actionText = isHoliday ? '設為假日' : '取消假日';
            const confirmResult = await Swal.fire({
                title: `將本月週末${actionText}？`, text: `共包含 ${weekendDates.length} 天`, icon: 'question',
                showCancelButton: true, confirmButtonColor: isHoliday ? '#f43f5e' : '#64748b',
                confirmButtonText: '確定執行', cancelButtonText: '取消'
            });

            if (!confirmResult.isConfirmed) return;
            document.getElementById('tLoading').classList.remove('hidden');
            try {
                const batch = writeBatch(db);
                weekendDates.forEach(dStr => {
                    const docRef = doc(db, 'artifacts', window.fbAppId, 'public', 'data', 'holidays', window.toDocId(dStr));
                    if(isHoliday) batch.set(docRef, { isHoliday: true, date: dStr });
                    else batch.delete(docRef);
                });
                await batch.commit();
                Swal.fire({ icon: 'success', title: '批次設定完成', timer: 1500, showConfirmButton: false });
            } catch (err) { Swal.fire('設定失敗', err.message, 'error'); } 
            finally { document.getElementById('tLoading').classList.add('hidden'); }
        };

        window.handleToggleLeave = async (studentId, isLeave) => {
            if(!checkFbAuth()) return;
            const confirmResult = await Swal.fire({
                title: `確認${isLeave ? '設為請假' : '取消請假'}？`, icon: 'question',
                showCancelButton: true, confirmButtonColor: isLeave ? '#f59e0b' : '#64748b',
                confirmButtonText: '確定', cancelButtonText: '關閉'
            });
            if (!confirmResult.isConfirmed) return;

            document.getElementById('tLoading').classList.remove('hidden');
            try {
                const docId = `${window.toDocId(window.selectedDateStr)}_${studentId}`;
                const docRef = doc(db, 'artifacts', window.fbAppId, 'public', 'data', 'daily_records', docId);
                await setDoc(docRef, {
                    date: window.selectedDateStr,
                    studentId: studentId,
                    isLeave: isLeave
                }, { merge: true });
                Swal.fire({ icon: 'success', title: '設定成功', text: isLeave ? '已設為請假' : '已取消請假', timer: 1000, showConfirmButton: false });
            } catch (err) { Swal.fire('設定失敗', err.message, 'error'); }
            finally { document.getElementById('tLoading').classList.add('hidden'); }
        };

        window.openStudentHistory = (studentId, studentName) => {
            window.shStudentId = studentId;
            document.getElementById('shModalTitle').innerText = `${studentName} - 出缺席紀錄`;
            document.getElementById('studentHistoryModal').classList.remove('hidden');
            window.shViewDate = new Date(window.viewDate);
            window.refreshUI();
        };

        window.closeStudentHistory = () => { document.getElementById('studentHistoryModal').classList.add('hidden'); };
        window.changeHistoryMonth = (offset) => { window.shViewDate.setMonth(window.shViewDate.getMonth() + offset); window.refreshUI(); };

        function renderHistoryCalendar() {
            const grid = document.getElementById('shCalendarGrid');
            const display = document.getElementById('shMonthDisplay');
            grid.innerHTML = "";
            const year = window.shViewDate.getFullYear();
            const month = window.shViewDate.getMonth();
            display.innerText = `${year}年 ${month + 1}月`;
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            const studentRecords = window.fbRecords.filter(r => r.studentId === window.shStudentId);
            const sSigned = new Set(studentRecords.filter(r => r.signed).map(r => r.date));
            const sLeave = new Set(studentRecords.filter(r => r.isLeave).map(r => r.date));

            for (let i = 0; i < firstDay; i++) grid.innerHTML += `<div></div>`;
            for (let d = 1; d <= daysInMonth; d++) {
                const dStr = window.normalizeDate(`${year}/${month + 1}/${d}`);
                const isSigned = sSigned.has(dStr);
                const isLeave = sLeave.has(dStr);
                
                const dayEl = document.createElement('div');
                let className = "aspect-square flex items-center justify-center rounded-xl text-[13px] font-bold transition-all ";
                
                if (isLeave) {
                    className += "border-2 border-amber-500 text-amber-600 bg-amber-50"; 
                } else if (isSigned) {
                    className += "bg-emerald-500 text-white shadow-sm"; 
                } else {
                    className += "text-slate-400 bg-slate-50"; 
                }
                
                if (dStr === window.todayStr && !isLeave && !isSigned) {
                    className += " border border-blue-300 text-blue-600";
                }
                
                dayEl.className = className;
                dayEl.innerText = d;
                grid.appendChild(dayEl);
            }
        }
    </script>

                <div class="hidden md:flex flex-col items-end mr-2">

                    <span class="text-[10px] text-emerald-500 font-bold uppercase tracking-widest flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        已連線 (動態學期載入中)
                    </span>
                    <script>
                        setTimeout(() => {
                           const el = document.querySelector('.text-emerald-500');
                           if(el && window.semesterData) el.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>已連線 (${window.semesterData.semesterName})`;
                        }, 2000);
                    </script>
                </div>
                <button onclick="window.goToUnifiedLogin()" aria-label="登出" title="登出" class="bg-slate-100 hover:bg-slate-200 p-2 rounded-full transition-colors"><i data-lucide="log-out" class="w-5 h-5"></i></button>
            </div>
        </header>

        <!-- 第 1 頁：現有聯絡簿面板 (已移除舊版留言板功能，高度拉滿對齊) -->
        <main id="dashboardPage" class="flex-1 w-full flex flex-col lg:flex-row overflow-hidden min-h-0 relative bg-slate-50">
            <div class="w-full lg:w-80 border-b lg:border-b-0 lg:border-r border-slate-200 bg-white shrink-0 flex flex-col h-[45vh] min-h-[280px] lg:min-h-0 lg:h-full overflow-hidden z-10 shadow-sm lg:shadow-none">
                <div class="px-5 pt-5 pb-3 flex justify-between items-center shrink-0 bg-white border-b border-slate-100">
                    <h2 class="font-bold text-slate-800 flex items-center gap-2"><i data-lucide="calendar-days" class="w-5 h-5 text-blue-600"></i> <span id="tMonthDisplay"></span></h2>
                    <div class="flex gap-2">
                        <button onclick="window.changeMonth(-1)" class="p-1.5 bg-slate-50 hover:bg-slate-100 rounded text-slate-500 transition-colors"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                        <button onclick="window.changeMonth(1)" class="p-1.5 bg-slate-50 hover:bg-slate-100 rounded text-slate-500 transition-colors"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                    </div>
                </div>

                <div id="teacherWeekStrip" class="hidden"></div>

                <div class="p-4 flex-1 overflow-y-auto custom-scrollbar">
                    <div class="grid grid-cols-7 text-center text-[10px] font-black text-slate-400 mb-3 uppercase tracking-wider">
                        <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                    </div>
                    <div id="tCalendarGrid" class="grid grid-cols-7 gap-1"></div>

                    <div class="mt-5 flex gap-2">
                        <button onclick="window.batchSetWeekends(true)" class="flex-1 text-[11px] bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold py-2.5 rounded-lg border border-rose-200 transition-colors shadow-sm">本月週末設為假日</button>
                        <button onclick="window.batchSetWeekends(false)" class="flex-1 text-[11px] bg-slate-50 hover:bg-slate-100 text-slate-500 font-bold py-2.5 rounded-lg border border-slate-200 transition-colors shadow-sm">清除週末設定</button>
                    </div>

                    <div class="mt-6 px-4 py-4 bg-slate-50 rounded-xl border border-slate-100 space-y-3 text-[12px] lg:text-[13px]">
                        <p class="font-bold text-slate-800 uppercase tracking-widest text-[10px] mb-2">圖例說明</p>
                        <div class="flex items-center gap-3"><div class="w-2.5 h-2.5 bg-purple-500 rounded-full"></div> <span class="font-medium text-slate-600">當日有行事曆</span></div>
                        <div class="flex items-center gap-3"><div class="w-2.5 h-2.5 bg-blue-500 rounded-full"></div> <span class="font-medium text-slate-600">當日有發布事項</span></div>
                    </div>
                </div>
            </div>

            <div class="flex-1 flex flex-col min-h-0 overflow-hidden relative">
                <div id="tLoading" class="absolute inset-0 z-20 bg-slate-50/80 backdrop-blur-sm hidden flex-col items-center justify-center">
                    <div class="loading-spinner mb-4"></div><p class="text-slate-500 font-bold animate-pulse">處理中...</p>
                </div>

                <div class="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-6 lg:p-10">
                    <div class="max-w-6xl mx-auto">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 gap-4">
                            <div>
                                <nav class="flex text-xs font-bold text-slate-400 mb-2 tracking-widest"><span>行事曆</span> <span class="mx-2">/</span> <span class="text-blue-600">公告事項</span></nav>
                                <h2 id="tDateTitle" class="text-3xl lg:text-4xl font-black text-slate-900">載入中...</h2>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 xl:grid-cols-12 gap-6 lg:gap-8">
                            
                            <!-- 左側：發布聯絡事項 (高度已拉滿) -->
                            <div id="teacherComposerCard" class="xl:col-span-12">
                                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full min-h-[500px]">
                                    <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                                        <div class="flex items-center gap-2"><i data-lucide="file-edit" class="w-5 h-5 text-blue-500"></i><h3 class="font-bold text-slate-700">發布聯絡事項</h3></div>
                                        <div class="flex items-center gap-4">
                                            <label class="flex items-center gap-2 cursor-pointer text-sm font-bold text-rose-500">
                                                <input type="checkbox" id="tHolidayToggle" onchange="window.handleToggleHoliday(this.checked)" class="w-4 h-4 accent-rose-500 rounded">設為假日
                                            </label>
                                            <span id="tSelectedDateLabel" class="inline-flex items-center rounded-lg bg-blue-50 border border-blue-100 px-2.5 py-1.5 text-[11px] font-black text-blue-700 whitespace-nowrap">發布日期 ----/--/--</span>
                                        </div>
                                    </div>
                                    <div class="p-5 flex-1 flex flex-col gap-4">
                                        <div class="flex items-center bg-purple-50 border border-purple-100 rounded-xl px-4 py-3">
                                            <i data-lucide="calendar-check" class="w-5 h-5 text-purple-500 mr-3 shrink-0"></i>
                                            <input type="text" id="tEventInput" placeholder="設定本日行事曆 (例如：期中考、戶外教學)..." class="flex-1 bg-transparent border-none outline-none text-purple-900 font-bold placeholder-purple-300 text-sm">
                                        </div>
                                        
                                        <textarea id="tNoteInput" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 transition-all resize-none text-base font-medium flex-1 min-h-[250px]" placeholder="請輸入聯絡事項..."></textarea>
                                        <div class="flex gap-3 pt-1">
                                            <button onclick="window.handleSaveNote()" id="saveBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all flex items-center justify-center gap-2 shadow-sm"><i data-lucide="send" class="w-4 h-4"></i> 儲存並發布</button>
                                            <button onclick="window.clearInput()" class="px-4 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl transition-colors" title="清除"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 右側：簽到與請假追蹤 -->
                            <div id="teacherSignatureCard" class="xl:col-span-6">
                                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full min-h-[500px]">
                                    <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                                        <div class="flex items-center gap-2"><i data-lucide="users" class="w-5 h-5 text-emerald-500"></i><h3 class="font-bold text-slate-700">簽到與請假追蹤</h3></div>
                                        <span class="text-[11px] text-slate-400 font-bold">點選分類篩選名單</span>
                                    </div>
                                    <div id="tSignSummary" class="grid grid-cols-3 gap-2 p-3 border-b border-slate-100 bg-slate-50/40"></div>
                                    <div class="p-2 flex-1 overflow-y-auto custom-scrollbar">
                                        <table class="w-full text-left border-separate border-spacing-0">
                                            <thead class="sticky top-0 bg-white shadow-sm z-10 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                                <tr>
                                                    <th class="px-3 py-3 border-b border-slate-100 text-center">座號</th>
                                                    <th class="px-3 py-3 border-b border-slate-100">姓名</th>
                                                    <th class="px-3 py-3 border-b border-slate-100 text-center">狀態</th>
                                                    <th class="px-3 py-3 border-b border-slate-100 text-right">操作</th>
                                                </tr>
                                            </thead>
                                            <tbody id="tStudentList" class="text-sm"></tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- 第 2 頁：班級群聊室 -->
        <main id="groupChatPage" class="hidden flex-1 w-full max-w-4xl mx-auto flex-col overflow-hidden min-h-0 relative shadow-sm lg:border-x border-slate-200 bg-white">
            <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center shrink-0 z-10 bg-slate-50/50">
                <h3 class="font-bold text-slate-700 flex items-center gap-2 text-[17px]">
                    <i data-lucide="message-circle" class="w-5 h-5 text-blue-500"></i>
                    班級家長交流群
                </h3>
            </div>

            <div id="groupChatScrollArea" class="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-6 flex flex-col relative scroll-smooth bg-slate-50/30">
                <div id="groupChatMessageList" class="flex flex-col min-h-full justify-end"></div>
            </div>

            <div class="p-3 md:p-4 bg-white shrink-0 border-t border-slate-200 z-20 pb-[max(1rem,env(safe-area-inset-bottom))]">
                <div class="flex gap-2 items-end bg-slate-50 rounded-2xl p-1.5 border border-slate-200 focus-within:border-blue-300 focus-within:ring-2 focus-within:ring-blue-100 transition-all">
                    
                    <!-- 📸 圖片上傳按鈕 (老師端群聊) -->
                    <label class="w-[42px] h-[42px] shrink-0 hover:bg-slate-200 rounded-full flex items-center justify-center transition-transform active:scale-90 mb-0.5 cursor-pointer text-slate-500">
                        <input type="file" accept="image/*" class="hidden" onchange="window.handleImageUpload(this, 'group')">
                        <i data-lucide="image" class="w-5 h-5"></i>
                    </label>

                    <textarea 
                        id="groupChatInput" 
                        rows="1" 
                        oninput="this.style.height='auto'; this.style.height=(this.scrollHeight)+'px';" 
                        onkeypress="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); window.sendGroupChatMessage();}" 
                        placeholder="以「蘇老師」的身份回覆..." 
                        class="flex-1 bg-transparent border-none resize-none pl-1 pr-1 py-2.5 text-[15px] outline-none max-h-[120px] min-h-[44px] overflow-y-auto leading-relaxed"
                    ></textarea>
                    <button 
                        onclick="window.sendGroupChatMessage()" 
                        class="w-[42px] h-[42px] shrink-0 bg-blue-600 hover:bg-blue-700 text-white rounded-full flex items-center justify-center transition-transform active:scale-90 mb-0.5"
                    >
                        <i data-lucide="send" class="w-4 h-4 ml-0.5"></i>
                    </button>
                </div>
            </div>
        </main>

        <!-- 第 3 頁：老師端私訊整合面板 -->
        <main id="privateChatPage" class="hidden flex-1 w-full flex flex-col md:flex-row overflow-hidden min-h-0 relative bg-white">
            
            <!-- 左側：學生列表 -->
            <div id="privateChatSidebar" class="w-full md:w-80 border-r border-slate-200 flex flex-col shrink-0 h-full bg-slate-50">
                <div class="p-4 border-b border-slate-200 bg-white shadow-sm z-10 flex justify-between items-center">
                    <h3 class="font-bold text-slate-700">家長私訊列表</h3>
                </div>
                <div id="chatStudentList" class="flex-1 overflow-y-auto custom-scrollbar p-2"></div>
            </div>

            <!-- 右側：與單一學生的私訊視窗 -->
            <div id="privateChatMainWindow" class="hidden md:flex flex-1 flex-col h-full bg-white relative">
                <div class="px-5 py-3 border-b border-slate-100 flex items-center shrink-0 z-10 bg-slate-50/50 gap-3">
                    <button onclick="window.backToChatList()" class="md:hidden p-1.5 hover:bg-slate-200 rounded-lg text-slate-600 transition-colors"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                    <h3 id="activeChatHeader" class="font-bold text-slate-700 text-lg flex-1 min-w-0 truncate">請從左側選擇家長</h3>
                    <button id="teacherVoiceCallButton" onclick="window.startVoiceCall()" type="button" class="hidden w-11 h-11 shrink-0 rounded-2xl bg-emerald-600 text-white shadow-sm active:scale-95" aria-label="發起語音通話" title="發起語音通話"><i data-lucide="phone-call" class="w-5 h-5 mx-auto"></i></button>
                </div>

                <div id="privateChatScrollArea" class="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-6 flex flex-col relative scroll-smooth bg-slate-50/30">
                    <div id="privateChatMessageList" class="flex flex-col min-h-full justify-end"></div>
                </div>

                <div id="privateChatInputArea" class="hidden p-3 md:p-4 bg-white shrink-0 border-t border-slate-200 z-20 pb-[max(1rem,env(safe-area-inset-bottom))]">
                    <div class="flex gap-2 items-end bg-slate-50 rounded-2xl p-1.5 border border-slate-200 focus-within:border-blue-300 focus-within:ring-2 focus-within:ring-blue-100 transition-all">
                        
                        <!-- 📸 圖片上傳按鈕 (老師端私訊) -->
                        <label class="w-[42px] h-[42px] shrink-0 hover:bg-slate-200 rounded-full flex items-center justify-center transition-transform active:scale-90 mb-0.5 cursor-pointer text-slate-500">
                            <input type="file" accept="image/*" class="hidden" onchange="window.handleImageUpload(this, 'private')">
                            <i data-lucide="image" class="w-5 h-5"></i>
                        </label>

                        <textarea 
                            id="privateChatInput" 
                            rows="1" 
                            oninput="this.style.height='auto'; this.style.height=(this.scrollHeight)+'px';" 
                            onkeypress="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); window.sendPrivateMessage();}" 
                            placeholder="輸入訊息私下回覆給家長..." 
                            class="flex-1 bg-transparent border-none resize-none pl-1 pr-1 py-2.5 text-[15px] outline-none max-h-[120px] min-h-[44px] overflow-y-auto leading-relaxed"
                        ></textarea>
                        <button 
                            onclick="window.sendPrivateMessage()" 
                            class="w-[42px] h-[42px] shrink-0 bg-blue-600 hover:bg-blue-700 text-white rounded-full flex items-center justify-center transition-transform active:scale-90 mb-0.5"
                        >
                            <i data-lucide="send" class="w-4 h-4 ml-0.5"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="studentHistoryModal" class="fixed inset-0 z-[100] bg-slate-900/50 backdrop-blur-sm hidden flex-col items-center justify-center p-4 fade-in">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col relative">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 class="font-bold text-slate-800 flex items-center gap-2"><i data-lucide="calendar-check" class="w-5 h-5 text-blue-600"></i><span id="shModalTitle">出缺席紀錄</span></h3>
                <button onclick="window.closeStudentHistory()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-6 relative">
                <div class="flex justify-between items-center mb-6">
                    <h4 id="shMonthDisplay" class="font-black text-xl text-slate-700"></h4>
                    <div class="flex gap-1 border border-slate-200 rounded-lg p-1">
                        <button onclick="window.changeHistoryMonth(-1)" class="p-1 hover:bg-slate-100 rounded-md text-slate-500"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                        <button onclick="window.changeHistoryMonth(1)" class="p-1 hover:bg-slate-100 rounded-md text-slate-500"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
                    </div>
                </div>
                <div class="grid grid-cols-7 text-center text-[11px] font-black text-slate-400 mb-3 uppercase tracking-wider">
                    <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                </div>
                <div id="shCalendarGrid" class="grid grid-cols-7 gap-1.5"></div>
                <div class="mt-8 pt-4 border-t border-slate-100 flex justify-center gap-6 text-xs font-bold text-slate-600">
                    <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-emerald-500 shadow-sm"></span>已簽名</div>
                    <div class="flex items-center gap-2"><span class="w-3 h-3 border-2 border-amber-500 rounded-full"></span>請假</div>
                </div>
            </div>
        </div>
    </div>

    <div id="teacherVoiceCallModal" class="hidden fixed inset-0 z-[200] bg-slate-950/75 backdrop-blur-sm p-5 items-center justify-center" role="dialog" aria-modal="true" aria-labelledby="teacherVoiceCallTitle">
        <section class="w-full max-w-sm rounded-[2rem] bg-white p-6 text-center shadow-2xl">
            <div class="mx-auto mb-5 flex h-20 w-20 items-center justify-center rounded-full bg-emerald-100 text-emerald-600"><i data-lucide="phone-call" class="w-9 h-9"></i></div>
            <p class="text-sm font-bold text-slate-400">一對一語音通話</p>
            <h2 id="teacherVoiceCallTitle" class="mt-1 text-2xl font-black text-slate-800">正在準備通話</h2>
            <p id="teacherVoiceCallStatus" class="mt-3 min-h-12 text-sm leading-relaxed text-slate-500">正在連線，請稍候。</p>
            <button id="teacherVoiceCallHangup" type="button" onclick="window.endVoiceCall('ended')" class="mt-5 min-h-14 w-full rounded-2xl bg-rose-600 font-black text-white shadow-lg shadow-rose-200 active:scale-[.98]">結束通話</button>
        </section>
    </div>
    <audio id="teacherRemoteAudio" autoplay playsinline></audio>
</body>
</html>

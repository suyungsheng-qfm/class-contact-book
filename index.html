<!DOCTYPE html>
<html lang="zh-TW" style="touch-action: manipulation;">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#d97706">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="班級聯絡簿(807)">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="icon" href="./app-icon-192.png" type="image/png">
    <title>班級聯絡簿(807)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { width: 100%; min-height: 100%; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; -webkit-tap-highlight-color: transparent; }
        .loading-spinner { border: 3px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; width: 20px; height: 20px; animation: spin .8s linear infinite; }
        .app-orb { position: fixed; border-radius: 999px; pointer-events: none; filter: blur(1px); opacity: .55; }
        .field-input { min-height: 52px; }
        .field-input:focus { box-shadow: 0 0 0 4px rgba(217,119,6,.12); }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-[100dvh] bg-[#f2f2f7] flex items-center justify-center p-4 sm:p-6 text-[#1c1c1e] overflow-x-hidden">
    <div class="app-orb w-56 h-56 bg-amber-100 -top-20 -right-20"></div>
    <div class="app-orb w-48 h-48 bg-orange-100 -bottom-16 -left-16"></div>
    <main class="w-full max-w-sm relative">
        <section class="bg-white/95 backdrop-blur rounded-[30px] p-6 sm:p-7 shadow-[0_20px_60px_rgba(28,28,30,.10)] border border-white">
            <div class="flex items-center justify-between mb-7">
                <div class="w-16 h-16 rounded-2xl bg-amber-50 text-[#d97706] flex items-center justify-center shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
                </div>
                <span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 border border-emerald-100 px-3 py-1.5 text-[11px] font-bold text-emerald-700"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>安全登入</span>
            </div>
            <h1 class="text-[26px] font-bold tracking-tight">班級聯絡簿(807)</h1>

            <form id="loginForm" class="mt-7 space-y-4">
                <div>
                    <label for="account" class="block text-sm font-semibold mb-2">學號</label>
                    <input id="account" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required class="field-input w-full px-4 rounded-xl bg-[#f2f2f7] border border-transparent outline-none focus:border-[#d97706] focus:bg-white transition-colors" placeholder="輸入學生學號">
                </div>
                <div>
                    <label for="password" class="block text-sm font-semibold mb-2">驗證碼</label>
                    <div class="relative">
                        <input id="password" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" required class="field-input w-full px-4 pr-12 rounded-xl bg-[#f2f2f7] border border-transparent outline-none focus:border-[#d97706] focus:bg-white transition-colors" placeholder="輸入驗證碼">
                        <button id="passwordToggle" type="button" class="absolute right-1 top-1 w-11 h-11 rounded-lg text-[#8e8e93] active:scale-95" aria-label="顯示密碼" aria-pressed="false">
                            <svg id="passwordToggleIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.06 12.35a1 1 0 0 1 0-.7C3.3 7.6 7.1 5 12 5c4.9 0 8.7 2.6 9.94 6.65a1 1 0 0 1 0 .7C20.7 16.4 16.9 19 12 19c-4.9 0-8.7-2.6-9.94-6.65Z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                <p id="loginError" class="hidden text-sm font-medium text-[#ff3b30] bg-red-50 rounded-xl px-3 py-2"></p>
                <button id="loginButton" type="submit" class="w-full min-h-[52px] rounded-xl bg-[#d97706] text-white font-bold shadow-lg shadow-amber-200 active:scale-[.98] disabled:opacity-70 disabled:active:scale-100 transition-transform flex items-center justify-center gap-2">登入</button>
            </form>
        </section>
        <button id="installAppButton" type="button" class="hidden w-full mt-4 min-h-[48px] rounded-xl bg-white/85 border border-amber-200 text-[#b45309] font-bold shadow-sm active:scale-[.98] transition-transform flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m8 11 4 4 4-4"/><path d="M5 21h14"/></svg>
            加入手機桌面
        </button>
        <a href="./guide.html" class="mt-3 flex min-h-[44px] items-center justify-center gap-2 rounded-xl text-sm font-bold text-[#a16207] active:scale-[.98]">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 1 1 5.72 1.29c-.54 1.08-1.82 1.36-2.42 2.29-.27.42-.4.9-.4 1.42"/><path d="M12 17h.01"/></svg>安裝與通知說明
        </a>
        <a href="./privacy.html" class="mt-1 flex min-h-[40px] items-center justify-center text-xs font-bold text-[#8e8e93] underline underline-offset-4">系統說明與隱私權政策</a>
        <p class="text-center text-xs text-[#8e8e93] mt-2">登入逾時後，系統會要求再次驗證身份。</p>
    </main>

    <div id="installGuide" class="hidden fixed inset-0 z-50 p-5 bg-slate-900/35 backdrop-blur-sm items-end sm:items-center justify-center" role="dialog" aria-modal="true" aria-labelledby="installGuideTitle">
        <section class="w-full max-w-sm bg-white rounded-[28px] p-6 shadow-2xl">
            <div class="w-12 h-12 rounded-2xl bg-amber-50 text-[#d97706] flex items-center justify-center mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m8 11 4 4 4-4"/><path d="M5 21h14"/></svg>
            </div>
            <h2 id="installGuideTitle" class="text-xl font-black">加入手機桌面</h2>
            <div id="installGuideContent" class="mt-2 text-sm leading-relaxed text-slate-500"></div>
            <button id="closeInstallGuide" type="button" class="w-full min-h-[48px] mt-6 rounded-xl bg-[#d97706] text-white font-bold active:scale-[.98] transition-transform">知道了</button>
        </section>
    </div>

    <script>
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzQBi-uoqSy73_VUD2xCpXqx2qPfARxvXxUFJwsd8wf_FcVkehubPpaDA0RQVgI11ky/exec';

        function isAppsScriptHost() {
            return /(^|\.)script\.google\.com$|(^|\.)googleusercontent\.com$/.test(window.location.hostname);
        }

        function navigateToAppPage(page) {
            if (!isAppsScriptHost()) {
                window.location.assign(page === 'index' ? './index.html' : `./${page}.html`);
                return;
            }
            const url = `${GAS_API_URL}?page=${encodeURIComponent(page)}`;
            const link = document.createElement('a');
            link.href = url;
            link.target = '_top';
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            setTimeout(() => window.location.replace(url), 500);
        }
        const form = document.getElementById('loginForm');
        const button = document.getElementById('loginButton');
        const error = document.getElementById('loginError');
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');
        const installButton = document.getElementById('installAppButton');
        const installGuide = document.getElementById('installGuide');
        const installGuideTitle = document.getElementById('installGuideTitle');
        const installGuideContent = document.getElementById('installGuideContent');
        const pendingLoginError = sessionStorage.getItem('contact-book-login-error');
        let deferredInstallPrompt = null;
        const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const isAndroid = /Android/i.test(navigator.userAgent);
        const isInAppBrowser = /FBAN|FBAV|Instagram|Line\/|MicroMessenger|\bwv\b/i.test(navigator.userAgent);
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

        if (pendingLoginError) {
            sessionStorage.removeItem('contact-book-login-error');
            error.textContent = pendingLoginError;
            error.classList.remove('hidden');
        }

        function showInstallButton() {
            if (!isStandalone) installButton.classList.remove('hidden');
        }

        // Some Android browsers never expose beforeinstallprompt. Keep a visible
        // fallback so every family can still find the manual add-to-home action.
        if (!isStandalone) showInstallButton();
        window.addEventListener('beforeinstallprompt', event => {
            event.preventDefault();
            deferredInstallPrompt = event;
            showInstallButton();
        });
        window.addEventListener('appinstalled', () => {
            deferredInstallPrompt = null;
            installButton.classList.add('hidden');
        });
        installButton.addEventListener('click', async () => {
            if (deferredInstallPrompt) {
                deferredInstallPrompt.prompt();
                await deferredInstallPrompt.userChoice;
                deferredInstallPrompt = null;
                return;
            }
            if (isInAppBrowser) {
                installGuideTitle.textContent = '請改用外部瀏覽器開啟';
                installGuideContent.innerHTML = '<p>目前是在 App 的內建瀏覽器中，通常無法加入手機桌面。</p><p class="mt-3">請從右上角選單選擇「在 Safari 開啟」或「在 Chrome 開啟」，再使用瀏覽器的加入主畫面功能。</p>';
            } else if (isIos) {
                installGuideTitle.textContent = '加入 iPhone 主畫面';
                installGuideContent.innerHTML = '<p>請使用 Safari 開啟本網站，點選下方的「分享」按鈕，再選擇「加入主畫面」。</p>';
            } else if (isAndroid) {
                installGuideTitle.textContent = '加入 Android 手機桌面';
                installGuideContent.innerHTML = '<p>請開啟瀏覽器右上角的「⋮」或選單，選擇「安裝應用程式」或「加入主畫面」。不同手機的名稱可能略有不同。</p><p class="mt-3">這是網頁捷徑，不會下載 APK，也不需要開啟未知來源安裝。</p>';
            } else {
                installGuideTitle.textContent = '加入手機桌面';
                installGuideContent.innerHTML = '<p>請從瀏覽器的選單尋找「安裝應用程式」或「加入主畫面」。</p>';
            }
            installGuide.classList.remove('hidden');
            installGuide.classList.add('flex');
        });
        document.getElementById('closeInstallGuide').addEventListener('click', () => {
            installGuide.classList.add('hidden');
            installGuide.classList.remove('flex');
        });
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
        }

        passwordToggle.addEventListener('click', () => {
            const showing = passwordInput.type === 'text';
            passwordInput.type = showing ? 'password' : 'text';
            passwordToggle.setAttribute('aria-pressed', String(!showing));
            passwordToggle.setAttribute('aria-label', showing ? '顯示密碼' : '隱藏密碼');
        });

        form.addEventListener('submit', async event => {
            event.preventDefault();
            const account = document.getElementById('account').value.trim();
            const password = passwordInput.value.trim();
            error.classList.add('hidden');
            button.disabled = true;
            button.innerHTML = '<span class="loading-spinner"></span>驗證中';
            try {
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'unifiedLogin', account, password })
                });
                const result = await response.json();
                if (!result.success || !result.sessionToken || !result.role) throw new Error(result.message || '登入失敗，請稍後再試。');

                sessionStorage.setItem('contact-book-session', result.sessionToken);
                navigateToAppPage(result.role === 'teacher' ? 'teacher' : 'guardians');
            } catch (err) {
                error.textContent = err.message || '無法登入，請檢查網路後重試。';
                error.classList.remove('hidden');
                button.disabled = false;
                button.textContent = '登入';
            }
        });
    </script>
</body>
</html>

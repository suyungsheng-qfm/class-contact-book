<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>班級聯絡簿</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { width: 100%; min-height: 100%; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; -webkit-tap-highlight-color: transparent; }
        .loading-spinner { border: 3px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; width: 20px; height: 20px; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-[100dvh] bg-[#f2f2f7] flex items-center justify-center p-4 text-[#1c1c1e]">
    <main class="w-full max-w-sm">
        <section class="bg-white rounded-[28px] p-7 shadow-[0_16px_50px_rgba(28,28,30,.08)] border border-white">
            <div class="w-16 h-16 rounded-2xl bg-amber-50 text-[#d97706] flex items-center justify-center mb-5">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
            </div>
            <h1 class="text-[26px] font-bold tracking-tight">班級聯絡簿</h1>
            <p class="text-sm text-[#8e8e93] mt-2 leading-relaxed">教師與家長共用同一入口；系統會依帳號身份帶您前往對應頁面。</p>

            <form id="loginForm" class="mt-7 space-y-4">
                <div>
                    <label for="account" class="block text-sm font-semibold mb-2">帳號／學號</label>
                    <input id="account" type="text" autocomplete="username" required class="w-full min-h-[48px] px-4 rounded-xl bg-[#f2f2f7] border border-transparent outline-none focus:border-[#d97706] focus:bg-white transition-colors" placeholder="輸入教師帳號或學生學號">
                </div>
                <div>
                    <label for="password" class="block text-sm font-semibold mb-2">密碼／驗證碼</label>
                    <input id="password" type="password" autocomplete="current-password" required class="w-full min-h-[48px] px-4 rounded-xl bg-[#f2f2f7] border border-transparent outline-none focus:border-[#d97706] focus:bg-white transition-colors" placeholder="輸入密碼或驗證碼">
                </div>
                <p id="loginError" class="hidden text-sm font-medium text-[#ff3b30] bg-red-50 rounded-xl px-3 py-2"></p>
                <button id="loginButton" type="submit" class="w-full min-h-[50px] rounded-xl bg-[#d97706] text-white font-bold shadow-lg shadow-amber-200 active:scale-[.98] transition-transform flex items-center justify-center gap-2">登入</button>
            </form>
        </section>
        <p class="text-center text-xs text-[#8e8e93] mt-5">登入逾時後，系統會要求再次驗證身份。</p>
    </main>

    <script>
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzQBi-uoqSy73_VUD2xCpXqx2qPfARxvXxUFJwsd8wf_FcVkehubPpaDA0RQVgI11ky/exec';

        function isAppsScriptHost() {
            return /(^|\.)script\.google\.com$|(^|\.)googleusercontent\.com$/.test(window.location.hostname);
        }

        function navigateToAppPage(page) {
            if (!isAppsScriptHost()) {
                window.location.assign(page === 'index' ? './index.html' : `./${page}.html`);
                return;
            }
            const url = `${GAS_API_URL}?page=${encodeURIComponent(page)}`;
            const link = document.createElement('a');
            link.href = url;
            link.target = '_top';
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            setTimeout(() => window.location.replace(url), 500);
        }
        const form = document.getElementById('loginForm');
        const button = document.getElementById('loginButton');
        const error = document.getElementById('loginError');

        form.addEventListener('submit', async event => {
            event.preventDefault();
            const account = document.getElementById('account').value.trim();
            const password = document.getElementById('password').value.trim();
            error.classList.add('hidden');
            button.disabled = true;
            button.innerHTML = '<span class="loading-spinner"></span>驗證中';
            try {
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'unifiedLogin', account, password })
                });
                const result = await response.json();
                if (!result.success || !result.sessionToken || !result.role) throw new Error(result.message || '登入失敗，請稍後再試。');

                sessionStorage.setItem('contact-book-session', result.sessionToken);
                navigateToAppPage(result.role === 'teacher' ? 'teacher' : 'guardians');
            } catch (err) {
                error.textContent = err.message || '無法登入，請檢查網路後重試。';
                error.classList.remove('hidden');
                button.disabled = false;
                button.textContent = '登入';
            }
        });
    </script>
</body>
</html>
